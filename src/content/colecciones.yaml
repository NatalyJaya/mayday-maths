# Col·leccions d’exercicis de classe. Cada exercici indica la seva amb
# «coleccion: <id>». Les variants («variante_de») es mostren agrupades
# sota el seu exercici principal.

- id: clase-identidades
  titulo: 'Trigonometria 2: identitats'
  corto: Identitats (classe)
  tema: identidades-ecuaciones
  descripcion: La simplificació de sin(a + b)·sin(a − b) / (cos a + cos b) i la demostració «per demà» amb l’angle doble i l’angle meitat, tal com apareixen als teus apunts.
  fuente: apuntes-trigonometria-2
  principales: [clase-simplifica-producto, clase-demuestra-tan-mitad]

- id: clase-serie-a
  titulo: 'Trigonometria 2: Sèrie A d’equacions'
  corto: Sèrie A (classe)
  tema: identidades-ecuaciones
  descripcion: Les vuit equacions de la foto d’equacions amb angle doble i angle meitat. Cal reduir-ho tot a una sola raó abans de resoldre.
  fuente: apuntes-trigonometria-2
  principales: [clase-a1, clase-a2, clase-a3, clase-a4, clase-a5, clase-a6, clase-a7, clase-a8]

- id: clase-serie-b
  titulo: 'Trigonometria 2: Sèrie B d’equacions (a–h)'
  corto: Sèrie B (classe)
  tema: identidades-ecuaciones
  descripcion: El full d’equacions a–h, de les més directes (2 sin x − 1 = 0) a les que demanen una identitat o factoritzar.
  fuente: apuntes-trigonometria-2
  principales: [clase-b-a, clase-b-b, clase-b-c, clase-b-d, clase-b-e, clase-b-f, clase-b-g, clase-b-h]

- id: clase-problema-31
  titulo: 'Trigonometria 2: Problema 31'
  corto: Problema 31 (classe)
  tema: resolucion-triangulos
  descripcion: Angles de depressió i teorema del cosinus per trobar la distància entre dos punts vistos des de dalt.
  fuente: apuntes-trigonometria-2
  principales: [clase-problema-31]
