titulo: Raons de l’angle meitat
tema: identidades-ecuaciones
orden: 5
procedencia: original
dificultad: intermedio
habilidades: [calculo, conceptual]
resumen: El signe de les arrels el decideix el quadrant de α/2, no el de α.
enunciado: |
  Sabent que $\cos\alpha = -\dfrac{7}{25}$ i que $180^\circ < \alpha < 270^\circ$, calcula $\sin\dfrac{\alpha}{2}$ i $\cos\dfrac{\alpha}{2}$.
apartados:
  - id: a
    enunciado: Escriu els dos valors.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\sin\frac{\alpha}{2}', etiqueta: '', unidad: '', valor: 0.8, trampas: [{ valor: -0.8, explicacion: 'Si $\alpha$ és entre $180^\circ$ i $270^\circ$, $\frac{\alpha}{2}$ és entre $90^\circ$ i $135^\circ$: segon quadrant, sinus positiu.' }] }
        - { simbolo: '\cos\frac{\alpha}{2}', etiqueta: '', unidad: '', valor: -0.6, trampas: [{ valor: 0.6, explicacion: '$\frac{\alpha}{2}$ és al segon quadrant: cosinus negatiu.' }] }
    pistas:
      - 'Entre quins valors és $\frac{\alpha}{2}$? A quin quadrant?'
      - '$\sin\frac{\alpha}{2} = \pm\sqrt{\frac{1 - \cos\alpha}{2}}$.'
    pasos:
      - titulo: Quadrant de α/2
        piensa: 'El signe depèn de $\alpha$ o de $\frac{\alpha}{2}$?'
        desarrollo: |
          $$90^\circ < \frac{\alpha}{2} < 135^\circ$$
          Segon quadrant: sinus positiu i cosinus negatiu.
      - titulo: Fórmules
        desarrollo: '$$\sin\frac{\alpha}{2} = +\sqrt{\frac{1 + \frac{7}{25}}{2}} = \sqrt{\frac{16}{25}} = \frac45 \qquad \cos\frac{\alpha}{2} = -\sqrt{\frac{1 - \frac{7}{25}}{2}} = -\sqrt{\frac{9}{25}} = -\frac35$$'
        porque: 'Comprovació: $0{,}64 + 0{,}36 = 1$ ✔.'
    resultado: '$\sin\frac{\alpha}{2} = \frac45$ i $\cos\frac{\alpha}{2} = -\frac35$.'
errores:
  - error: 'Triar el signe segons el quadrant de α'
    explicacion: '$\alpha$ és al tercer quadrant (sinus i cosinus negatius), però $\frac{\alpha}{2}$ és al segon. És el quadrant de $\frac{\alpha}{2}$ el que decideix.'
