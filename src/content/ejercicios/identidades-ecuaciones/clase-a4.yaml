titulo: 'cos 2x = sin x'
tema: identidades-ecuaciones
orden: 104
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Sèrie A
nota_fuente: 'La lletra d’aquest enunciat no es llegia bé a la foto; s’ha transcrit com cos 2x = sin x.'
coleccion: clase-serie-a
dificultad: intermedio
habilidades: [calculo, metodo]
resumen: Angle doble, tot a un costat i equació de segon grau en el sinus.
enunciado: |
  Resol a $[0^\circ,\ 360^\circ)$:
  $$\cos 2x = \sin x$$
conceptos:
  - '$\cos 2x = 1 - 2\sin^2 x$.'
  - 'Canvi de variable $t = \sin x$.'
  - '$\sin x = -1$ només té una solució per volta: $270^\circ$.'
apartados:
  - id: a
    enunciado: Escriu totes les solucions a $[0^\circ,\ 360^\circ)$.
    respuesta:
      tipo: conjunto
      valores: [30, 150, 270]
      trampas:
        - valores: [90, 210, 330]
          explicacion: 'Has resolt $2\sin^2 x - \sin x - 1 = 0$: hi ha un signe canviat en passar els termes d’un costat a l’altre. Comprova que $x = 90^\circ$ no compleix $\cos 2x = \sin x$: $\cos 180^\circ = -1$ i $\sin 90^\circ = 1$.'
        - valores: [30, 150]
          explicacion: 'Et falta la solució de $\sin x = -1$.'
    pistas:
      - 'Fes servir la forma de $\cos 2x$ que només té sinus.'
      - 'Passa-ho tot al mateix costat amb compte amb els signes: queda $2\sin^2 x + \sin x - 1 = 0$.'
    pasos:
      - titulo: Angle doble
        desarrollo: '$$1 - 2\sin^2 x = \sin x$$'
        porque: 'Així tota l’equació queda en funció de $\sin x$.'
      - titulo: Passar-ho tot a un costat
        desarrollo: '$$0 = 2\sin^2 x + \sin x - 1 \quad\Longleftrightarrow\quad 2\sin^2 x + \sin x - 1 = 0$$'
        porque: 'Si ho passes tot al costat dret, els termes de l’esquerra canvien de signe: $-1$, $+2\sin^2 x$, i el $\sin x$ que ja era a la dreta continua amb $+$.'
      - titulo: Canvi de variable
        desarrollo: '$$2t^2 + t - 1 = 0 \;\Rightarrow\; t = \frac{-1 \pm \sqrt{1 + 8}}{4} = \frac{-1 \pm 3}{4} \;\Rightarrow\; t = \tfrac12 \ \text{ o } \ t = -1$$'
      - titulo: Desfer el canvi
        desarrollo: |
          - $\sin x = \tfrac12 \Rightarrow x = 30^\circ$ i $180^\circ - 30^\circ = 150^\circ$.
          - $\sin x = -1 \Rightarrow x = 270^\circ$.
      - titulo: Comprovar
        desarrollo: 'Amb $x = 270^\circ$: $\cos 540^\circ = \cos 180^\circ = -1$ i $\sin 270^\circ = -1$ ✔.'
    resultado: '$x = 30^\circ,\ 150^\circ,\ 270^\circ$.'
errores:
  - error: 'Escriure $2\sin^2 x - \sin x + 1 = 0$ (error dels apunts)'
    explicacion: 'Els signes de $\sin x$ i de l’$1$ estaven canviats. Aquesta equació no té solucions reals (discriminant $1 - 8 < 0$), cosa que ja és una pista que alguna cosa falla, perquè $x = 30^\circ$ sí que compleix l’equació original.'
laboratorio: { f: sin, n: 1, k: 0.5 }
