titulo: '6 cos²(x/2) + cos x − 1 = 0'
tema: identidades-ecuaciones
orden: 106
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Serie A, apartado i)
coleccion: clase-serie-a
dificultad: avanzado
habilidades: [calculo, metodo]
resumen: Ángulo mitad, pero sin raíces. Aprovecha que ya aparece al cuadrado.
enunciado: |
  Resuelve en $[0^\circ,\ 360^\circ)$:
  $$6\cos^2\frac{x}{2} + \cos x - 1 = 0$$
conceptos:
  - '$\cos^2\dfrac{x}{2} = \dfrac{1 + \cos x}{2}$: es la fórmula del ángulo mitad antes de hacer la raíz.'
  - '$\cos x = -\tfrac12$ en el segundo y el tercer cuadrante.'
apartados:
  - id: a
    enunciado: Escribe todas las soluciones en $[0^\circ,\ 360^\circ)$.
    respuesta:
      tipo: conjunto
      valores: [120, 240]
      trampas:
        - valores: [60, 300]
          explicacion: 'Esos ángulos tienen $\cos x = +\tfrac12$. La ecuación da $\cos x = -\tfrac12$: el coseno es negativo en el segundo y el tercer cuadrante.'
    pistas:
      - 'No hace falta la raíz: lo que aparece es $\cos^2\frac{x}{2}$, y eso tiene fórmula directa.'
      - '$\cos^2\frac{x}{2} = \frac{1 + \cos x}{2}$. Sustituye y verás que queda una ecuación de primer grado.'
    pasos:
      - titulo: Fórmula del ángulo mitad, sin raíz
        piensa: '¿Necesitas $\cos\frac{x}{2}$ o te basta con su cuadrado?'
        desarrollo: '$$\cos^2\frac{x}{2} = \frac{1 + \cos x}{2}$$'
        porque: 'Es la igualdad de la que sale la fórmula del ángulo mitad (antes de la raíz). Usarla evita la raíz y el $\pm$.'
      - titulo: Sustituir
        desarrollo: |
          $$6\cdot\frac{1 + \cos x}{2} + \cos x - 1 = 0 \;\Rightarrow\; 3 + 3\cos x + \cos x - 1 = 0 \;\Rightarrow\; 4\cos x + 2 = 0$$
      - titulo: Despejar
        desarrollo: '$$\cos x = -\frac{2}{4} = -\frac12$$'
      - titulo: Ángulos
        desarrollo: 'El ángulo de referencia es $60^\circ$ y el coseno es negativo en el 2.º y el 3.er cuadrante: $x = 180^\circ - 60^\circ = 120^\circ$ y $x = 180^\circ + 60^\circ = 240^\circ$.'
      - titulo: Comprobar
        desarrollo: 'Con $x = 120^\circ$: $\cos^2 60^\circ = \frac14$, así que $6\cdot\frac14 - \frac12 - 1 = 1{,}5 - 0{,}5 - 1 = 0$ ✔.'
    resultado: '$x = 120^\circ,\ 240^\circ$.'
errores:
  - error: 'Meter la raíz de la fórmula del ángulo mitad y luego elevar (enfoque de los apuntes)'
    explicacion: 'En los apuntes se usaba $\cos\frac{x}{2} = \pm\sqrt{\frac{1+\cos x}{2}}$, se elevaba al cuadrado y salía $2\cos^2 x + 6\cos x - 3 = 0$, que no es correcta. Como en la ecuación ya aparece $\cos^2\frac{x}{2}$, la fórmula sin raíz es directa y no hay nada que elevar.'
laboratorio: { f: cos, n: 1, k: -0.5 }
