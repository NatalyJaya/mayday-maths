titulo: 'cos x − sin x = cos 2x'
tema: identidades-ecuaciones
orden: 107
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Sèrie A, apartat m)
nota_fuente: 'A la foto sembla que posa «cos 3x», però s’ha llegit com cos 2x, que encaixa amb el pas cos(2x − x) dels apunts i dona una factorització molt neta.'
coleccion: clase-serie-a
dificultad: avanzado
habilidades: [calculo, metodo, multipaso]
resumen: Diferència de quadrats, factor comú i una solució falsa que apareix en elevar al quadrat.
enunciado: |
  Resol a $[0^\circ,\ 360^\circ)$:
  $$\cos x - \sin x = \cos 2x$$
conceptos:
  - '$\cos 2x = \cos^2 x - \sin^2 x = (\cos x - \sin x)(\cos x + \sin x)$.'
  - 'En elevar al quadrat apareixen solucions falses: cal comprovar-les.'
apartados:
  - id: a
    enunciado: Escriu totes les solucions a $[0^\circ,\ 360^\circ)$.
    respuesta:
      tipo: conjunto
      valores: [0, 45, 90, 225]
      trampas:
        - valores: [45, 225]
          explicacion: 'Això surt si divideixes entre $\cos x - \sin x$. En dividir es perden les solucions de l’altre factor, $\cos x + \sin x = 1$.'
        - valores: [0, 45, 90, 180, 225, 270]
          explicacion: 'En resoldre $\cos x + \sin x = 1$ elevant al quadrat hi apareixen $180^\circ$ i $270^\circ$, que no compleixen l’equació: $\cos 180^\circ + \sin 180^\circ = -1$. Comprova sempre després d’elevar al quadrat.'
    pistas:
      - '$\cos 2x = \cos^2 x - \sin^2 x$ és una diferència de quadrats.'
      - 'En factoritzar apareix $\cos x - \sin x$ als dos costats: treu factor comú (no divideixis).'
      - 'Per a $\cos x + \sin x = 1$ pots elevar al quadrat, però després comprova.'
    pasos:
      - titulo: Diferència de quadrats
        desarrollo: '$$\cos x - \sin x = (\cos x - \sin x)(\cos x + \sin x)$$'
        porque: '$\cos^2 x - \sin^2 x = (\cos x - \sin x)(\cos x + \sin x)$, com $a^2 - b^2 = (a - b)(a + b)$.'
      - titulo: Factor comú
        desarrollo: '$$(\cos x - \sin x) - (\cos x - \sin x)(\cos x + \sin x) = 0 \;\Rightarrow\; (\cos x - \sin x)(1 - \cos x - \sin x) = 0$$'
      - titulo: Primer factor
        desarrollo: '$\cos x - \sin x = 0 \Rightarrow \tan x = 1 \Rightarrow x = 45^\circ,\ 225^\circ$.'
        porque: 'Es pot dividir entre $\cos x$ perquè si $\cos x = 0$ aleshores $\sin x = \pm1$ i la resta no seria 0.'
      - titulo: Segon factor
        desarrollo: |
          $\cos x + \sin x = 1$. Elevant al quadrat: $1 + 2\sin x\cos x = 1 \Rightarrow \sin 2x = 0 \Rightarrow x = 0^\circ,\ 90^\circ,\ 180^\circ,\ 270^\circ$.

          Comprovació (obligatòria en elevar al quadrat): $0^\circ$ ✔ ($1 + 0 = 1$), $90^\circ$ ✔ ($0 + 1 = 1$), $180^\circ$ ✘ ($-1 + 0$), $270^\circ$ ✘ ($0 - 1$).
        porque: 'En elevar al quadrat, també s’hi colen les solucions de $\cos x + \sin x = -1$.'
    resultado: '$x = 0^\circ,\ 45^\circ,\ 90^\circ,\ 225^\circ$.'
errores:
  - error: 'Dividir entre $\cos x - \sin x$'
    explicacion: 'Es perden $45^\circ$ i $225^\circ$, o es perd l’altre factor, segons com es faci. Amb factor comú no es perd res.'
  - error: 'No comprovar després d’elevar al quadrat'
    explicacion: '$180^\circ$ i $270^\circ$ semblen solucions, però no ho són.'
alternativas:
  - titulo: 'Una altra manera de resoldre cos x + sin x = 1'
    desarrollo: 'Com que $\cos x + \sin x = \sqrt2\,\sin(x + 45^\circ)$, l’equació és $\sin(x + 45^\circ) = \frac{\sqrt2}{2}$, d’on $x + 45^\circ = 45^\circ$ o $135^\circ$: $x = 0^\circ$ o $90^\circ$. Sense elevar al quadrat, no hi ha solucions falses.'
