titulo: '1 / (cos x + sin x) = 2 (cos x − sin x)'
tema: identidades-ecuaciones
orden: 201
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Serie B, apartado a)
coleccion: clase-serie-b
dificultad: avanzado
habilidades: [calculo, metodo, multipaso]
resumen: Quitar el denominador con su condición y reconocer una diferencia de cuadrados.
enunciado: |
  Resuelve en $[0^\circ,\ 360^\circ)$:
  $$\frac{1}{\cos x + \sin x} = 2(\cos x - \sin x)$$
conceptos:
  - 'Al multiplicar por un denominador hay que exigir que no se anule.'
  - '$(\cos x - \sin x)(\cos x + \sin x) = \cos^2 x - \sin^2 x = \cos 2x$.'
apartados:
  - id: a
    enunciado: Escribe todas las soluciones en $[0^\circ,\ 360^\circ)$.
    respuesta:
      tipo: conjunto
      valores: [30, 150, 210, 330]
      trampas:
        - valores: [30, 330]
          explicacion: 'Te faltan las soluciones de $\cos x = -\frac{\sqrt3}{2}$: al hacer la raíz de $\cos^2 x = \frac34$ hay que poner $\pm$.'
    pistas:
      - 'Multiplica los dos miembros por $\cos x + \sin x$ (exigiendo que no valga 0).'
      - 'Te queda una suma por diferencia: $(\cos x - \sin x)(\cos x + \sin x)$.'
      - 'Llega a $\cos^2 x = \frac34$ y no olvides el $\pm$.'
    pasos:
      - titulo: Quitar el denominador
        desarrollo: '$$1 = 2(\cos x - \sin x)(\cos x + \sin x), \qquad \cos x + \sin x \ne 0$$'
        porque: '$\cos x + \sin x = 0$ cuando $\tan x = -1$, es decir, en $135^\circ$ y $315^\circ$. Esos valores quedan excluidos.'
      - titulo: Suma por diferencia
        desarrollo: '$$1 = 2(\cos^2 x - \sin^2 x)$$'
      - titulo: Todo en cosenos
        desarrollo: '$$1 = 2\big(\cos^2 x - (1 - \cos^2 x)\big) = 2(2\cos^2 x - 1)$$'
        porque: 'También se ve que $\cos^2 x - \sin^2 x = \cos 2x$, así que la ecuación es $\cos 2x = \tfrac12$.'
      - titulo: Despejar
        desarrollo: '$$\tfrac12 = 2\cos^2 x - 1 \;\Rightarrow\; \cos^2 x = \tfrac34 \;\Rightarrow\; \cos x = \pm\tfrac{\sqrt3}{2}$$'
      - titulo: Ángulos y comprobación
        desarrollo: |
          - $\cos x = \frac{\sqrt3}{2} \Rightarrow x = 30^\circ,\ 330^\circ$.
          - $\cos x = -\frac{\sqrt3}{2} \Rightarrow x = 150^\circ,\ 210^\circ$.

          Ninguno es $135^\circ$ ni $315^\circ$: todos valen.
    resultado: '$x = 30^\circ,\ 150^\circ,\ 210^\circ,\ 330^\circ$.'
alternativas:
  - titulo: Con el ángulo doble
    desarrollo: '$1 = 2\cos 2x \Rightarrow \cos 2x = \frac12$. Como $2x$ recorre $[0^\circ,\ 720^\circ)$: $2x = 60^\circ,\ 300^\circ,\ 420^\circ,\ 660^\circ$, y dividiendo entre 2, $x = 30^\circ,\ 150^\circ,\ 210^\circ,\ 330^\circ$.'
laboratorio: { f: cos, n: 2, k: 0.5 }
