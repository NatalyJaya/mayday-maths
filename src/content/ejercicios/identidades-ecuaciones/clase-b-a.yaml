titulo: '1 / (cos x + sin x) = 2 (cos x − sin x)'
tema: identidades-ecuaciones
orden: 201
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Sèrie B, apartat a)
coleccion: clase-serie-b
dificultad: avanzado
habilidades: [calculo, metodo, multipaso]
resumen: Treure el denominador amb la seva condició i reconèixer una diferència de quadrats.
enunciado: |
  Resol a $[0^\circ,\ 360^\circ)$:
  $$\frac{1}{\cos x + \sin x} = 2(\cos x - \sin x)$$
conceptos:
  - 'En multiplicar per un denominador cal exigir que no s’anul·li.'
  - '$(\cos x - \sin x)(\cos x + \sin x) = \cos^2 x - \sin^2 x = \cos 2x$.'
apartados:
  - id: a
    enunciado: Escriu totes les solucions a $[0^\circ,\ 360^\circ)$.
    respuesta:
      tipo: conjunto
      valores: [30, 150, 210, 330]
      trampas:
        - valores: [30, 330]
          explicacion: 'Et falten les solucions de $\cos x = -\frac{\sqrt3}{2}$: en fer l’arrel de $\cos^2 x = \frac34$ cal posar-hi $\pm$.'
    pistas:
      - 'Multiplica els dos membres per $\cos x + \sin x$ (exigint que no valgui 0).'
      - 'Et queda una suma per diferència: $(\cos x - \sin x)(\cos x + \sin x)$.'
      - 'Arriba a $\cos^2 x = \frac34$ i no t’oblidis del $\pm$.'
    pasos:
      - titulo: Treure el denominador
        desarrollo: '$$1 = 2(\cos x - \sin x)(\cos x + \sin x), \qquad \cos x + \sin x \ne 0$$'
        porque: '$\cos x + \sin x = 0$ quan $\tan x = -1$, és a dir, a $135^\circ$ i $315^\circ$. Aquests valors queden exclosos.'
      - titulo: Suma per diferència
        desarrollo: '$$1 = 2(\cos^2 x - \sin^2 x)$$'
      - titulo: Tot en cosinus
        desarrollo: '$$1 = 2\big(\cos^2 x - (1 - \cos^2 x)\big) = 2(2\cos^2 x - 1)$$'
        porque: 'També es veu que $\cos^2 x - \sin^2 x = \cos 2x$, així que l’equació és $\cos 2x = \tfrac12$.'
      - titulo: Aïllar
        desarrollo: '$$\tfrac12 = 2\cos^2 x - 1 \;\Rightarrow\; \cos^2 x = \tfrac34 \;\Rightarrow\; \cos x = \pm\tfrac{\sqrt3}{2}$$'
      - titulo: Angles i comprovació
        desarrollo: |
          - $\cos x = \frac{\sqrt3}{2} \Rightarrow x = 30^\circ,\ 330^\circ$.
          - $\cos x = -\frac{\sqrt3}{2} \Rightarrow x = 150^\circ,\ 210^\circ$.

          Cap no és $135^\circ$ ni $315^\circ$: totes valen.
    resultado: '$x = 30^\circ,\ 150^\circ,\ 210^\circ,\ 330^\circ$.'
alternativas:
  - titulo: Amb l’angle doble
    desarrollo: '$1 = 2\cos 2x \Rightarrow \cos 2x = \frac12$. Com que $2x$ recorre $[0^\circ,\ 720^\circ)$: $2x = 60^\circ,\ 300^\circ,\ 420^\circ,\ 660^\circ$, i dividint entre 2, $x = 30^\circ,\ 150^\circ,\ 210^\circ,\ 330^\circ$.'
laboratorio: { f: cos, n: 2, k: 0.5 }
