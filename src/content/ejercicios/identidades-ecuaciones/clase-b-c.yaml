titulo: '2 sin x − 1 = 0'
tema: identidades-ecuaciones
orden: 203
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Sèrie B, apartat c)
coleccion: clase-serie-b
dificultad: basico
habilidades: [calculo, graficas]
resumen: L’equació més directa. Però hi ha dos angles amb sinus 1/2.
enunciado: |
  Resol a $[0^\circ,\ 360^\circ)$:
  $$2\sin x - 1 = 0$$
figura:
  tipo: circunferencia
  angulos:
    - { grados: 30, etiqueta: '30°' }
    - { grados: 150, etiqueta: '150°' }
  recta: { tipo: seno, valor: 0.5 }
  proyecciones: false
conceptos:
  - '$\sin x = k$ té dues solucions per volta: $\theta$ i $180^\circ - \theta$.'
apartados:
  - id: a
    enunciado: Escriu totes les solucions a $[0^\circ,\ 360^\circ)$.
    respuesta:
      tipo: conjunto
      valores: [30, 150]
      trampas:
        - valores: [30]
          explicacion: 'És el que dona la calculadora (i el que hi havia a la llibreta), però en falta una altra: el sinus també és positiu al segon quadrant. La recta $y = \frac12$ talla la circumferència en dos punts.'
    pistas:
      - 'Aïlla $\sin x$.'
      - 'A la circumferència, la recta horitzontal $y = \frac12$ talla en dos punts. Quins angles tenen?'
    pasos:
      - titulo: Aïllar
        desarrollo: '$$2\sin x = 1 \;\Rightarrow\; \sin x = \tfrac12$$'
      - titulo: Els dos angles
        desarrollo: '$\arcsin\frac12 = 30^\circ$. El sinus també és positiu al segon quadrant: $180^\circ - 30^\circ = 150^\circ$.'
        porque: '$30^\circ$ i $150^\circ$ són simètrics respecte de l’eix $Y$: tenen la mateixa altura.'
    resultado: '$x = 30^\circ,\ 150^\circ$.'
errores:
  - error: 'Donar només $30^\circ$ (com a la llibreta)'
    explicacion: 'La calculadora retorna un sol angle. L’altre, $150^\circ$, s’ha de buscar amb la simetria.'
laboratorio: { f: sin, n: 1, k: 0.5 }
