titulo: '3 tan²x − 1 = 0'
tema: identidades-ecuaciones
orden: 204
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Sèrie B, apartat d)
coleccion: clase-serie-b
dificultad: basico
habilidades: [calculo]
resumen: Una arrel quadrada amb el seu ± i la tangent, que es repeteix cada 180°.
enunciado: |
  Resol a $[0^\circ,\ 360^\circ)$:
  $$3\tan^2 x - 1 = 0$$
conceptos:
  - 'Si $t^2 = a$, aleshores $t = \pm\sqrt a$.'
  - '$\tan 30^\circ = \frac{\sqrt3}{3}$ i la tangent es repeteix cada $180^\circ$.'
apartados:
  - id: a
    enunciado: Escriu totes les solucions a $[0^\circ,\ 360^\circ)$.
    respuesta:
      tipo: conjunto
      valores: [30, 150, 210, 330]
      trampas:
        - valores: [30, 210]
          explicacion: 'T’has oblidat del signe $-$ de l’arrel: també $\tan x = -\frac{\sqrt3}{3}$.'
        - valores: [30, 150]
          explicacion: 'La tangent es repeteix cada $180^\circ$: a cada solució suma-hi $180^\circ$.'
    pistas:
      - 'Aïlla $\tan^2 x$ i fes l’arrel amb $\pm$.'
      - '$\tan 30^\circ = \frac{\sqrt3}{3}$.'
    pasos:
      - titulo: Aïllar
        desarrollo: '$$\tan^2 x = \tfrac13 \;\Rightarrow\; \tan x = \pm\sqrt{\tfrac13} = \pm\tfrac{\sqrt3}{3}$$'
      - titulo: Angles
        desarrollo: |
          - $\tan x = \frac{\sqrt3}{3} \Rightarrow x = 30^\circ,\ 210^\circ$.
          - $\tan x = -\frac{\sqrt3}{3} \Rightarrow x = 150^\circ,\ 330^\circ$.
        porque: 'La tangent és positiva al 1r i al 3r quadrant, i negativa al 2n i al 4t.'
    resultado: '$x = 30^\circ,\ 150^\circ,\ 210^\circ,\ 330^\circ$.'
