titulo: 'sin 2x = cos 60°'
tema: identidades-ecuaciones
orden: 205
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Sèrie B, apartat e)
coleccion: clase-serie-b
dificultad: intermedio
habilidades: [calculo, conceptual, graficas]
resumen: Amb 2x l’angle fa dues voltes, així que hi ha el doble de solucions.
enunciado: |
  Resol a $[0^\circ,\ 360^\circ)$:
  $$\sin 2x = \cos 60^\circ$$
figura:
  tipo: funcion
  curvas:
    - { f: sin, b: 2, etiqueta: 'y = sin 2x', color: y }
  niveles:
    - { y: 0.5, etiqueta: 'y = 1/2' }
  puntos:
    - { x: 15, etiqueta: '15°' }
    - { x: 75, etiqueta: '75°' }
    - { x: 195, etiqueta: '195°' }
    - { x: 255, etiqueta: '255°' }
conceptos:
  - '$\cos 60^\circ = \frac12$.'
  - 'Si $x \in [0^\circ,\ 360^\circ)$, aleshores $2x \in [0^\circ,\ 720^\circ)$: dues voltes.'
apartados:
  - id: a
    enunciado: Escriu totes les solucions a $[0^\circ,\ 360^\circ)$.
    respuesta:
      tipo: conjunto
      valores: [15, 75, 195, 255]
      trampas:
        - valores: [15]
          explicacion: 'És l’única solució que hi havia a la llibreta. En falten tres: $\sin u = \frac12$ té dues solucions per volta, i $u = 2x$ fa dues voltes.'
        - valores: [15, 75]
          explicacion: 'Has buscat $2x$ només en una volta. Com que $x$ arriba fins a $360^\circ$, $2x$ arriba fins a $720^\circ$: suma $360^\circ$ a $30^\circ$ i a $150^\circ$ abans de dividir.'
        - valores: [30, 150]
          explicacion: 'Aquestes són les solucions de $\sin x = \frac12$, no de $\sin 2x = \frac12$. Et falta dividir entre 2 (i buscar en dues voltes).'
    pistas:
      - '$\cos 60^\circ$ és un nombre. Quin?'
      - 'Anomena $u = 2x$. Entre quins valors es mou $u$?'
      - 'Troba els $u$ entre $0^\circ$ i $720^\circ$ i després divideix entre 2.'
    pasos:
      - titulo: Calcular el nombre
        desarrollo: '$$\sin 2x = \tfrac12$$'
      - titulo: Solucions per a l’angle 2x
        piensa: 'Si $x$ va de $0^\circ$ a $360^\circ$, fins on arriba $2x$?'
        desarrollo: '$\sin u = \frac12$ amb $u = 2x \in [0^\circ,\ 720^\circ)$: $u = 30^\circ,\ 150^\circ$ i, una volta després, $u = 390^\circ,\ 510^\circ$.'
        porque: 'En duplicar l’angle, en una volta de $x$ l’angle $2x$ fa dues voltes.'
      - titulo: Dividir entre 2
        desarrollo: '$$x = 15^\circ,\ 75^\circ,\ 195^\circ,\ 255^\circ$$'
    resultado: '$x = 15^\circ,\ 75^\circ,\ 195^\circ,\ 255^\circ$.'
errores:
  - error: 'Dividir entre 2 abans de buscar totes les solucions de 2x'
    explicacion: 'Es perden les dues solucions de la segona volta. Primer totes les de $2x$ a $[0^\circ,\ 720^\circ)$; després, dividir.'
laboratorio: { f: sin, n: 2, k: 0.5 }
