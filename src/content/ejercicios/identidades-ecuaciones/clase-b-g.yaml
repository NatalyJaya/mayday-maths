titulo: 'cos²x = cos x'
tema: identidades-ecuaciones
orden: 207
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Sèrie B, apartat g)
coleccion: clase-serie-b
dificultad: basico
habilidades: [calculo, conceptual]
resumen: El clàssic «no divideixis». Factor comú i dos casos.
enunciado: |
  Resol a $[0^\circ,\ 360^\circ)$:
  $$\cos^2 x = \cos x$$
conceptos:
  - 'Si $A\cdot B = 0$, aleshores $A = 0$ o $B = 0$.'
apartados:
  - id: a
    enunciado: Escriu totes les solucions a $[0^\circ,\ 360^\circ)$.
    respuesta:
      tipo: conjunto
      valores: [0, 90, 270]
      trampas:
        - valores: [0]
          explicacion: 'Has dividit entre $\cos x$ i t’has quedat amb $\cos x = 1$. Es perden les solucions de $\cos x = 0$: $90^\circ$ i $270^\circ$.'
        - valores: [90, 270]
          explicacion: 'Et falta el cas $\cos x = 1$.'
    pistas:
      - 'Passa-ho tot a un costat. No divideixis entre $\cos x$.'
      - '$\cos x\,(\cos x - 1) = 0$.'
    pasos:
      - titulo: Tot a un costat i factor comú
        desarrollo: '$$\cos^2 x - \cos x = 0 \;\Rightarrow\; \cos x\,(\cos x - 1) = 0$$'
        porque: 'A la teva llibreta apareix com $t(t - 1) = 0$ amb $t = \cos x$: és el mateix pas.'
      - titulo: Els dos casos
        desarrollo: |
          - $\cos x = 0 \Rightarrow x = 90^\circ,\ 270^\circ$.
          - $\cos x = 1 \Rightarrow x = 0^\circ$.
    resultado: '$x = 0^\circ,\ 90^\circ,\ 270^\circ$.'
errores:
  - error: 'No resoldre el cas cos x = 0 (com a la llibreta)'
    explicacion: 'En plantejar $t(t-1) = 0$ surten dos casos i tots dos donen solucions.'
