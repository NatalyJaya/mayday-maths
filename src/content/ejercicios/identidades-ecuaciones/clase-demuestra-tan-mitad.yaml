titulo: 'Demostra que sin 2x/(1 + cos 2x) · cos x/(1 + cos x) = tan(x/2)'
tema: identidades-ecuaciones
orden: 2
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Identitats, exercici 3.2 («per demà»)
nota_fuente: 'Als apunts s’arribava a sin x/(1 + cos x) i faltava justificar l’últim pas; aquí és complet.'
coleccion: clase-identidades
dificultad: examen
habilidades: [demostracion, calculo, multipaso]
resumen: Angle doble per al primer factor i angle doble aplicat a x/2 per tancar la demostració.
enunciado: |
  Demostra la identitat:
  $$\frac{\sin 2x}{1 + \cos 2x}\cdot\frac{\cos x}{1 + \cos x} = \tan\frac{x}{2}$$
conceptos:
  - '$\sin 2\alpha = 2\sin\alpha\cos\alpha$ i $\cos 2\alpha = \cos^2\alpha - \sin^2\alpha = 2\cos^2\alpha - 1$.'
  - 'Per demostrar una identitat, es transforma un membre fins a arribar a l’altre. No es «passa» res d’un costat a l’altre.'
interpretacion: |
  El membre esquerre té angles $2x$ i $x$; el dret, $\frac{x}{2}$. Cal baixar de $2x$ a $x$ amb l’angle doble i després d’$x$ a $\frac{x}{2}$, un altre cop amb l’angle doble, aplicat a $\alpha = \frac{x}{2}$.
apartados:
  - id: a
    enunciado: Escriu la demostració a la llibreta i compara-la amb la solució.
    respuesta:
      tipo: abierta
      criterio: 'Comprova que cada igualtat està justificada amb una fórmula i que arribes exactament a tan(x/2).'
    pistas:
      - 'Comença pel primer factor: fes servir l’angle doble a dalt i a baix. Escriu l’1 com $\sin^2 x + \cos^2 x$.'
      - 'El primer factor val $\tan x$. Multiplica pel segon i simplifica $\cos x$.'
      - 'Et queda $\frac{\sin x}{1 + \cos x}$. Ara escriu $x = 2\cdot\frac{x}{2}$ i aplica una altra vegada l’angle doble.'
    pasos:
      - titulo: Primer factor
        desarrollo: |
          $$\sin 2x = 2\sin x\cos x$$
          $$1 + \cos 2x = (\sin^2 x + \cos^2 x) + (\cos^2 x - \sin^2 x) = 2\cos^2 x$$
          $$\frac{\sin 2x}{1 + \cos 2x} = \frac{2\sin x\cos x}{2\cos^2 x} = \frac{\sin x}{\cos x} = \tan x$$
        porque: 'Escriure l’1 com $\sin^2 x + \cos^2 x$ fa que els sinus al quadrat es cancel·lin.'
      - titulo: Multiplicar pel segon factor
        desarrollo: '$$\tan x\cdot\frac{\cos x}{1 + \cos x} = \frac{\sin x}{\cos x}\cdot\frac{\cos x}{1 + \cos x} = \frac{\sin x}{1 + \cos x}$$'
      - titulo: Últim pas, amb l’angle doble aplicat a x/2
        piensa: 'Com passaries d’$x$ a $\frac{x}{2}$?'
        desarrollo: |
          Amb $\alpha = \frac{x}{2}$ (és a dir, $x = 2\alpha$):
          $$\sin x = 2\sin\tfrac{x}{2}\cos\tfrac{x}{2} \qquad 1 + \cos x = 1 + \left(2\cos^2\tfrac{x}{2} - 1\right) = 2\cos^2\tfrac{x}{2}$$
          $$\frac{\sin x}{1 + \cos x} = \frac{2\sin\frac{x}{2}\cos\frac{x}{2}}{2\cos^2\frac{x}{2}} = \frac{\sin\frac{x}{2}}{\cos\frac{x}{2}} = \tan\frac{x}{2} \quad ∎$$
        porque: 'Les fórmules de l’angle doble valen per a qualsevol angle, també per a $\frac{x}{2}$.'
    resultado: 'El primer membre val $\frac{\sin x}{1 + \cos x}$, que és $\tan\frac{x}{2}$. La identitat és certa sempre que els denominadors no s’anul·lin.'
errores:
  - error: 'Igualar sin x/(1 + cos x) a tan(x/2) sense justificar-ho'
    explicacion: 'Als apunts es citava la fórmula $\tan\frac{x}{2} = \pm\sqrt{\frac{1 - \cos x}{1 + \cos x}}$, però calia explicar per què desapareix el $\pm$. El camí amb l’angle doble no té arrels ni signes dubtosos.'
alternativas:
  - titulo: Amb la fórmula de l’angle meitat (el camí dels apunts, completat)
    desarrollo: |
      $$\tan\frac{x}{2} = \pm\sqrt{\frac{1 - \cos x}{1 + \cos x}} = \pm\sqrt{\frac{(1 - \cos x)(1 + \cos x)}{(1 + \cos x)^2}} = \pm\frac{|\sin x|}{1 + \cos x}$$
      S’ha multiplicat dins de l’arrel per $1 + \cos x$ a dalt i a baix, i $1 - \cos^2 x = \sin^2 x$. Com que $\tan\frac{x}{2}$ i $\sin x$ **sempre tenen el mateix signe** (tots dos positius si $x \in (0^\circ,\ 180^\circ)$; tots dos negatius si $x \in (180^\circ,\ 360^\circ)$), el $\pm$ i el valor absolut es compensen: $\tan\frac{x}{2} = \frac{\sin x}{1 + \cos x}$.
