titulo: 'Simplifica sin(a + b)·sin(a − b) / (cos a + cos b)'
tema: identidades-ecuaciones
orden: 1
procedencia: clase
fuente: apuntes-trigonometria-2
referencia: Identitats, exercici 3.1
coleccion: clase-identidades
dificultad: avanzado
habilidades: [calculo, demostracion, multipaso]
resumen: Suma i resta, diferència de quadrats dues vegades i simplificar amb el denominador.
enunciado: |
  Simplifica l’expressió:
  $$\frac{\sin(a + b)\cdot\sin(a - b)}{\cos a + \cos b}$$
conceptos:
  - '$\sin(a \pm b) = \sin a\cos b \pm \cos a\sin b$.'
  - '$(X + Y)(X - Y) = X^2 - Y^2$.'
  - '$\sin^2\theta = 1 - \cos^2\theta$.'
interpretacion: |
  El denominador només té cosinus. La idea és desenvolupar el numerador, passar-lo **tot a cosinus** i **factoritzar-lo** perquè hi aparegui $\cos a + \cos b$ i es pugui simplificar.
apartados:
  - id: a
    enunciado: A què és igual l’expressió (quan $\cos a + \cos b \ne 0$)?
    respuesta:
      tipo: opciones
      opciones:
        - texto: '$\cos b - \cos a$'
          correcta: true
          explicacion: 'El numerador val $\cos^2 b - \cos^2 a = (\cos b + \cos a)(\cos b - \cos a)$, i el primer factor se simplifica amb el denominador.'
        - texto: '$\cos a - \cos b$'
          explicacion: 'Gairebé: revisa l’ordre. En passar a cosinus, el numerador queda $\cos^2 b - \cos^2 a$, no $\cos^2 a - \cos^2 b$.'
        - texto: '$\sin a - \sin b$'
          explicacion: 'Amb $a = 90^\circ$ i $b = 0^\circ$ l’expressió val $\frac{1\cdot 1}{0 + 1} = 1$, i $\sin a - \sin b = 1$; però amb $a = 60^\circ$, $b = 0^\circ$ val $\frac{(\sqrt3/2)^2}{1{,}5} = 0{,}5$ i $\sin 60^\circ - \sin 0^\circ \approx 0{,}87$. No és una identitat.'
        - texto: '$\sin(a - b)$'
          explicacion: 'No es pot «ratllar» $\sin(a + b)$ amb $\cos a + \cos b$: no són iguals.'
    pistas:
      - 'Desenvolupa $\sin(a + b)$ i $\sin(a - b)$. Quina forma té el seu producte?'
      - 'És una suma per diferència: $(X + Y)(X - Y) = X^2 - Y^2$ amb $X = \sin a\cos b$ i $Y = \cos a\sin b$.'
      - 'Passa els sinus al quadrat a cosinus. Es cancel·la un terme i queda una altra diferència de quadrats.'
    pasos:
      - titulo: Desenvolupar amb la suma i la resta
        desarrollo: |
          $$\sin(a + b) = \sin a\cos b + \cos a\sin b \qquad \sin(a - b) = \sin a\cos b - \cos a\sin b$$
      - titulo: Suma per diferència
        desarrollo: '$$\sin(a + b)\sin(a - b) = \sin^2 a\cos^2 b - \cos^2 a\sin^2 b$$'
        porque: 'És $(X + Y)(X - Y) = X^2 - Y^2$ amb $X = \sin a\cos b$, $Y = \cos a\sin b$.'
      - titulo: Passar els sinus a cosinus
        desarrollo: '$$= (1 - \cos^2 a)\cos^2 b - (1 - \cos^2 b)\cos^2 a$$'
        porque: 'El denominador només té cosinus; així els podrem comparar.'
      - titulo: Treure parèntesis i cancel·lar
        desarrollo: '$$= \cos^2 b - \cos^2 a\cos^2 b - \cos^2 a + \cos^2 a\cos^2 b = \cos^2 b - \cos^2 a$$'
        porque: 'Els termes $\cos^2 a\cos^2 b$ i $-\cos^2 a\cos^2 b$ s’anul·len (als apunts apareixen ratllats).'
      - titulo: Factoritzar i simplificar
        desarrollo: '$$\frac{(\cos b + \cos a)(\cos b - \cos a)}{\cos a + \cos b} = \cos b - \cos a$$'
        porque: '$\cos b + \cos a = \cos a + \cos b$: es pot simplificar sempre que no valgui 0.'
    resultado: '$$\frac{\sin(a + b)\sin(a - b)}{\cos a + \cos b} = \cos b - \cos a \qquad (\cos a + \cos b \ne 0)$$'
errores:
  - error: '«Simplificar» sinus amb cosinus'
    explicacion: 'Només se simplifiquen factors iguals. Per això cal transformar el numerador fins que hi aparegui el factor $\cos a + \cos b$.'
  - error: 'Escriure $(X + Y)(X - Y) = X^2 + Y^2$'
    explicacion: 'És $X^2 - Y^2$: els productes creuats s’anul·len i l’últim porta signe menys.'
