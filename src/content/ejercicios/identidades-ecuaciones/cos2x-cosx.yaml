titulo: 'cos 2x + cos x = 0'
tema: identidades-ecuaciones
orden: 12
procedencia: original
dificultad: avanzado
habilidades: [calculo, metodo]
resumen: Angle doble en cosinus i equació de segon grau amb una solució única per volta.
enunciado: 'Resol a $[0^\circ,\ 360^\circ)$: $\quad\cos 2x + \cos x = 0$'
apartados:
  - id: a
    enunciado: Escriu totes les solucions.
    respuesta:
      tipo: conjunto
      valores: [60, 180, 300]
      trampas:
        - { valores: [60, 300], explicacion: 'Et falta la solució de $\cos x = -1$.' }
    pistas:
      - 'Fes servir $\cos 2x = 2\cos^2 x - 1$.'
      - '$2t^2 + t - 1 = 0$ té arrels $t = \frac12$ i $t = -1$.'
    pasos:
      - titulo: Una sola raó
        desarrollo: '$$2\cos^2 x - 1 + \cos x = 0 \;\Rightarrow\; 2\cos^2 x + \cos x - 1 = 0$$'
      - titulo: Canvi de variable
        desarrollo: '$$t = \frac{-1 \pm\sqrt{1 + 8}}{4} = \frac{-1 \pm 3}{4} \;\Rightarrow\; t = \tfrac12 \ \text{ o } \ t = -1$$'
      - titulo: Angles
        desarrollo: '$\cos x = \frac12 \Rightarrow x = 60^\circ,\ 300^\circ$. $\quad\cos x = -1 \Rightarrow x = 180^\circ$ (només una).'
    resultado: '$x = 60^\circ,\ 180^\circ,\ 300^\circ$.'
