titulo: Demostra que cos⁴x − sin⁴x = cos 2x
tema: identidades-ecuaciones
orden: 8
procedencia: original
dificultad: intermedio
habilidades: [demostracion, calculo]
resumen: Una diferència de quadrats amagada.
enunciado: |
  Demostra la identitat:
  $$\cos^4 x - \sin^4 x = \cos 2x$$
apartados:
  - id: a
    enunciado: Escriu la demostració.
    respuesta:
      tipo: abierta
    pistas:
      - '$\cos^4 x = (\cos^2 x)^2$. Quina forma té el primer membre?'
      - '$a^2 - b^2 = (a + b)(a - b)$ amb $a = \cos^2 x$ i $b = \sin^2 x$.'
    pasos:
      - titulo: Diferència de quadrats
        desarrollo: '$$\cos^4 x - \sin^4 x = (\cos^2 x + \sin^2 x)(\cos^2 x - \sin^2 x)$$'
      - titulo: Identitat fonamental i angle doble
        desarrollo: '$$= 1\cdot(\cos^2 x - \sin^2 x) = \cos 2x \quad ∎$$'
    resultado: 'El primer membre és igual a $\cos 2x$ per a tot $x$.'
errores:
  - error: 'Escriure cos⁴x − sin⁴x = (cos x − sin x)⁴'
    explicacion: 'Una resta de potències no és la potència de la resta. Amb $x = 0^\circ$: $1 - 0 = 1$, però $(1 - 0)^4 = 1$ coincideix per casualitat; amb $x = 45^\circ$ el primer membre val 0 i el segon també, però amb $x = 90^\circ$: $0 - 1 = -1$ davant de $(0 - 1)^4 = 1$.'
