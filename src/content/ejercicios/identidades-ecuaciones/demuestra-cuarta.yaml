titulo: Demuestra que cos⁴x − sin⁴x = cos 2x
tema: identidades-ecuaciones
orden: 8
procedencia: original
dificultad: intermedio
habilidades: [demostracion, calculo]
resumen: Una diferencia de cuadrados escondida.
enunciado: |
  Demuestra la identidad:
  $$\cos^4 x - \sin^4 x = \cos 2x$$
apartados:
  - id: a
    enunciado: Escribe la demostración.
    respuesta:
      tipo: abierta
    pistas:
      - '$\cos^4 x = (\cos^2 x)^2$. ¿Qué forma tiene el primer miembro?'
      - '$a^2 - b^2 = (a + b)(a - b)$ con $a = \cos^2 x$ y $b = \sin^2 x$.'
    pasos:
      - titulo: Diferencia de cuadrados
        desarrollo: '$$\cos^4 x - \sin^4 x = (\cos^2 x + \sin^2 x)(\cos^2 x - \sin^2 x)$$'
      - titulo: Identidad fundamental y ángulo doble
        desarrollo: '$$= 1\cdot(\cos^2 x - \sin^2 x) = \cos 2x \quad ∎$$'
    resultado: 'El primer miembro es igual a $\cos 2x$ para todo $x$.'
errores:
  - error: 'Escribir cos⁴x − sin⁴x = (cos x − sin x)⁴'
    explicacion: 'Una resta de potencias no es la potencia de la resta. Con $x = 0^\circ$: $1 - 0 = 1$, pero $(1 - 0)^4 = 1$ coincide por casualidad; con $x = 45^\circ$ el primer miembro vale 0 y el segundo también, pero con $x = 90^\circ$: $0 - 1 = -1$ frente a $(0 - 1)^4 = 1$.'
