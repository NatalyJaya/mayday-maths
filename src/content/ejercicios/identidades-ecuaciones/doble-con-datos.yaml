titulo: Raons de l’angle doble a partir d’un sinus
tema: identidades-ecuaciones
orden: 2
procedencia: original
dificultad: basico
habilidades: [calculo]
resumen: Primer el cosinus amb el seu signe; després, les fórmules de l’angle doble.
enunciado: |
  Sabent que $\sin\alpha = \dfrac45$ i que $\alpha$ és al primer quadrant, calcula $\sin 2\alpha$, $\cos 2\alpha$ i $\tan 2\alpha$.
apartados:
  - id: a
    enunciado: Escriu els tres valors.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\sin 2\alpha', etiqueta: '', unidad: '', valor: 0.96, trampas: [{ valor: 1.6, explicacion: '$\sin 2\alpha \ne 2\sin\alpha$. A més, cap sinus no val més d’1.' }] }
        - { simbolo: '\cos 2\alpha', etiqueta: '', unidad: '', valor: -0.28 }
        - { simbolo: '\tan 2\alpha', etiqueta: '', unidad: '', valor: -3.4286 }
    pistas:
      - 'Primer, $\cos\alpha$ amb la identitat fonamental.'
      - '$\sin 2\alpha = 2\sin\alpha\cos\alpha$ i $\cos 2\alpha = \cos^2\alpha - \sin^2\alpha$.'
    pasos:
      - titulo: Cosinus
        desarrollo: '$$\cos\alpha = +\sqrt{1 - \frac{16}{25}} = \frac35$$'
        porque: 'Primer quadrant: cosinus positiu.'
      - titulo: Angle doble
        desarrollo: '$$\sin 2\alpha = 2\cdot\frac45\cdot\frac35 = \frac{24}{25} \qquad \cos 2\alpha = \frac{9}{25} - \frac{16}{25} = -\frac{7}{25} \qquad \tan 2\alpha = \frac{24/25}{-7/25} = -\frac{24}{7}$$'
        porque: '$\cos 2\alpha < 0$ indica que $2\alpha$ és al segon quadrant: $\alpha \approx 53{,}13^\circ$ i $2\alpha \approx 106{,}26^\circ$.'
    resultado: '$\sin 2\alpha = \frac{24}{25}$, $\cos 2\alpha = -\frac{7}{25}$, $\tan 2\alpha = -\frac{24}{7} \approx -3{,}4286$.'
