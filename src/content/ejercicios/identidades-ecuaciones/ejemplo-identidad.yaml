titulo: Demuestra que sin 2x / (1 − cos 2x) = 1 / tan x
tema: identidades-ecuaciones
rol: ejemplo
orden: 2
procedencia: original
dificultad: intermedio
habilidades: [demostracion, calculo]
resumen: Ángulo doble arriba y abajo, y la forma de cos 2x que hace desaparecer el 1.
enunciado: |
  Demuestra la identidad (para los $x$ en que tiene sentido):
  $$\frac{\sin 2x}{1 - \cos 2x} = \frac{1}{\tan x}$$
apartados:
  - id: a
    enunciado: Escribe la demostración.
    respuesta:
      tipo: abierta
    pasos:
      - titulo: Elegir el miembro
        piensa: ¿Por qué lado empezarías?
        desarrollo: 'Por el izquierdo, que tiene ángulos dobles. El derecho ya es sencillo: $\frac{1}{\tan x} = \frac{\cos x}{\sin x}$.'
        porque: 'Se transforma el miembro más complicado hasta llegar al otro.'
      - titulo: Numerador
        desarrollo: '$$\sin 2x = 2\sin x\cos x$$'
      - titulo: Denominador
        piensa: '$\cos 2x$ tiene tres formas. ¿Cuál hace desaparecer el 1?'
        desarrollo: '$$1 - \cos 2x = 1 - (1 - 2\sin^2 x) = 2\sin^2 x$$'
        porque: 'Con $\cos 2x = 1 - 2\sin^2 x$ los unos se cancelan.'
      - titulo: Simplificar
        desarrollo: '$$\frac{2\sin x\cos x}{2\sin^2 x} = \frac{\cos x}{\sin x} = \frac{1}{\tan x} \quad ∎$$'
        porque: 'Se simplifican los factores $2$ y $\sin x$ (con $\sin x \ne 0$).'
    resultado: 'El primer miembro se transforma en $\frac{\cos x}{\sin x} = \frac{1}{\tan x}$. La identidad es cierta para $x \ne 180^\circ k$ (y $x \ne 90^\circ + 180^\circ k$, donde $\tan x$ no existe).'
errores:
  - error: 'Usar cos 2x = cos²x − sin²x en el denominador'
    explicacion: 'No es un error, pero queda $1 - \cos^2 x + \sin^2 x$ y hay que dar un paso más ($1 - \cos^2 x = \sin^2 x$). Elegir bien la forma ahorra trabajo.'
