titulo: El cosinus i la tangent de 15°
tema: identidades-ecuaciones
rol: ejemplo
orden: 1
procedencia: original
dificultad: basico
habilidades: [calculo]
resumen: 15° = 45° − 30°, fórmules de la resta i racionalitzar.
enunciado: Calcula el valor exacte de $\cos 15^\circ$ i de $\tan 15^\circ$.
apartados:
  - id: a
    enunciado: '$\cos 15^\circ$ i $\tan 15^\circ$ (escriu els decimals).'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\cos 15^\circ', etiqueta: '', unidad: '', valor: 0.9659, tolerancia: 0.003 }
        - { simbolo: '\tan 15^\circ', etiqueta: '', unidad: '', valor: 0.2679, tolerancia: 0.005 }
    pasos:
      - titulo: Escriure 15° amb angles notables
        piensa: Amb quins angles notables pots formar 15°?
        desarrollo: '$$15^\circ = 45^\circ - 30^\circ$$'
        porque: 'Així podem fer servir les raons exactes de $45^\circ$ i $30^\circ$. També valdria $60^\circ - 45^\circ$.'
      - titulo: Cosinus de la resta
        desarrollo: |
          $$\cos 15^\circ = \cos 45^\circ\cos 30^\circ + \sin 45^\circ\sin 30^\circ = \frac{\sqrt2}{2}\cdot\frac{\sqrt3}{2} + \frac{\sqrt2}{2}\cdot\frac12 = \frac{\sqrt6 + \sqrt2}{4} \approx 0{,}9659$$
        porque: 'En el cosinus de la resta el signe central és $+$.'
      - titulo: Tangent de la resta
        piensa: 'Fas servir la fórmula de la tangent o divideixes sinus entre cosinus?'
        desarrollo: |
          $$\tan 15^\circ = \frac{\tan 45^\circ - \tan 30^\circ}{1 + \tan 45^\circ\tan 30^\circ} = \frac{1 - \frac{\sqrt3}{3}}{1 + \frac{\sqrt3}{3}} = \frac{3 - \sqrt3}{3 + \sqrt3}$$
      - titulo: Racionalitzar
        desarrollo: |
          $$\frac{3 - \sqrt3}{3 + \sqrt3}\cdot\frac{3 - \sqrt3}{3 - \sqrt3} = \frac{9 - 6\sqrt3 + 3}{9 - 3} = \frac{12 - 6\sqrt3}{6} = 2 - \sqrt3 \approx 0{,}2679$$
        porque: 'Es multiplica pel conjugat del denominador per treure l’arrel.'
    resultado: '$\cos 15^\circ = \dfrac{\sqrt6 + \sqrt2}{4} \approx 0{,}9659$ i $\tan 15^\circ = 2 - \sqrt3 \approx 0{,}2679$.'
errores:
  - error: 'Escriure cos(45° − 30°) = cos 45° − cos 30°'
    explicacion: 'Donaria $\frac{\sqrt2 - \sqrt3}{2} < 0$: impossible, perquè el cosinus d’un angle agut és positiu.'
alternativas:
  - titulo: Amb l’angle meitat
    desarrollo: '$15^\circ = \frac{30^\circ}{2}$, al primer quadrant: $\cos 15^\circ = \sqrt{\frac{1 + \cos 30^\circ}{2}} = \sqrt{\frac{2 + \sqrt3}{4}} = \frac{\sqrt{2 + \sqrt3}}{2} \approx 0{,}9659$. És el mateix nombre escrit d’una altra manera.'
