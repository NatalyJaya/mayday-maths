titulo: El cosinus i la tangent de 75°
tema: identidades-ecuaciones
orden: 1
procedencia: original
dificultad: basico
habilidades: [calculo]
resumen: Suma d’angles notables.
enunciado: Calcula el valor exacte de $\cos 75^\circ$ i de $\tan 75^\circ$.
apartados:
  - id: a
    enunciado: Escriu els valors decimals (quatre decimals).
    respuesta:
      tipo: numerica
      campos:
        - simbolo: '\cos 75^\circ'
          etiqueta: ''
          unidad: ''
          valor: 0.2588
          tolerancia: 0.005
          trampas:
            - { valor: 1.5731, explicacion: 'Has «repartit»: $\cos 45^\circ + \cos 30^\circ$. El cosinus d’una suma no és la suma dels cosinus.' }
        - { simbolo: '\tan 75^\circ', etiqueta: '', unidad: '', valor: 3.7321, tolerancia: 0.005 }
    pistas:
      - '$75^\circ = 45^\circ + 30^\circ$.'
      - 'En el cosinus de la suma, el signe central és $-$.'
    pasos:
      - titulo: Cosinus de la suma
        desarrollo: '$$\cos 75^\circ = \cos 45^\circ\cos 30^\circ - \sin 45^\circ\sin 30^\circ = \frac{\sqrt6}{4} - \frac{\sqrt2}{4} = \frac{\sqrt6 - \sqrt2}{4} \approx 0{,}2588$$'
      - titulo: Tangent de la suma
        desarrollo: '$$\tan 75^\circ = \frac{1 + \frac{\sqrt3}{3}}{1 - \frac{\sqrt3}{3}} = \frac{3 + \sqrt3}{3 - \sqrt3} = 2 + \sqrt3 \approx 3{,}7321$$'
        porque: 'Es racionalitza multiplicant per $3 + \sqrt3$ a dalt i a baix.'
    resultado: '$\cos 75^\circ = \frac{\sqrt6 - \sqrt2}{4}$ i $\tan 75^\circ = 2 + \sqrt3$.'
