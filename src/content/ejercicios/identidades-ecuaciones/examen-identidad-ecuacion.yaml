titulo: Primero la identidad, después la ecuación
tema: identidades-ecuaciones
orden: 13
procedencia: original
dificultad: examen
habilidades: [demostracion, calculo, multipaso]
resumen: Demostrar una identidad y usarla para resolver una ecuación con su dominio.
enunciado: |
  a) Demuestra que $\dfrac{1 - \cos 2x}{\sin 2x} = \tan x$ (donde los dos miembros existen).

  b) Resuelve en $[0^\circ,\ 360^\circ)$: $\quad\dfrac{1 - \cos 2x}{\sin 2x} = \sqrt3$
apartados:
  - id: a
    enunciado: Demostración.
    respuesta:
      tipo: abierta
    pistas:
      - 'Usa $\cos 2x = 1 - 2\sin^2 x$ en el numerador.'
    pasos:
      - titulo: Ángulo doble
        desarrollo: '$$\frac{1 - \cos 2x}{\sin 2x} = \frac{1 - (1 - 2\sin^2 x)}{2\sin x\cos x} = \frac{2\sin^2 x}{2\sin x\cos x} = \frac{\sin x}{\cos x} = \tan x \quad ∎$$'
        porque: 'Se simplifica $2\sin x$, que no es cero donde el primer miembro existe ($\sin 2x \ne 0$).'
    resultado: 'Identidad demostrada, para $\sin 2x \ne 0$.'
  - id: b
    enunciado: Soluciones de la ecuación.
    respuesta:
      tipo: conjunto
      valores: [60, 240]
      trampas:
        - { valores: [60], explicacion: 'La tangente se repite cada $180^\circ$: falta $240^\circ$.' }
    pistas:
      - 'Por el apartado a), la ecuación es $\tan x = \sqrt3$.'
      - 'Comprueba que las soluciones no anulan $\sin 2x$.'
    pasos:
      - titulo: Usar la identidad
        desarrollo: '$$\tan x = \sqrt3 \;\Rightarrow\; x = 60^\circ,\ 240^\circ$$'
      - titulo: Dominio
        desarrollo: '$\sin 2x = 0$ en $0^\circ,\ 90^\circ,\ 180^\circ,\ 270^\circ$. Ninguna solución es de esas: las dos valen.'
    resultado: '$x = 60^\circ,\ 240^\circ$.'
