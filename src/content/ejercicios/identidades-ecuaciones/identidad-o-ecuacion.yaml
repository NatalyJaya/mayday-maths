titulo: ¿Cuál es una identidad?
tema: identidades-ecuaciones
orden: 4
procedencia: original
dificultad: basico
habilidades: [conceptual]
resumen: Distinguir una identidad de una ecuación.
enunciado: Solo una de estas igualdades es una identidad (se cumple para todo $x$).
apartados:
  - id: a
    enunciado: ¿Cuál?
    respuesta:
      tipo: opciones
      opciones:
        - { texto: '$\sin 2x = 2\sin x$', explicacion: 'Contraejemplo: con $x = 90^\circ$, $\sin 180^\circ = 0$ pero $2\sin 90^\circ = 2$. Es una ecuación (se cumple solo en algunos $x$).' }
        - { texto: '$(\sin x + \cos x)^2 = 1 + \sin 2x$', correcta: true, explicacion: 'Desarrollando: $\sin^2 x + 2\sin x\cos x + \cos^2 x = 1 + 2\sin x\cos x = 1 + \sin 2x$, para todo $x$.' }
        - { texto: '$\cos 2x = 1$', explicacion: 'Solo se cumple si $2x$ es un número entero de vueltas: en $0^\circ$ y $180^\circ$ de la primera vuelta. Es una ecuación.' }
        - { texto: '$\sin x + \cos x = 1$', explicacion: 'Con $x = 45^\circ$ vale $\sqrt2 \ne 1$. Es una ecuación (soluciones $0^\circ$ y $90^\circ$ en la primera vuelta).' }
    pistas:
      - 'Busca un contraejemplo para cada una. La que no tenga ninguno, demuéstrala.'
    pasos:
      - titulo: Desarrollar el cuadrado
        desarrollo: '$$(\sin x + \cos x)^2 = \sin^2 x + \cos^2 x + 2\sin x\cos x = 1 + \sin 2x$$'
        porque: 'Se usan la identidad fundamental y el ángulo doble, que valen para todo $x$.'
    resultado: 'La identidad es $(\sin x + \cos x)^2 = 1 + \sin 2x$.'
