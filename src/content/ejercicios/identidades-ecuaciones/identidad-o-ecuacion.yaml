titulo: Quina és una identitat?
tema: identidades-ecuaciones
orden: 4
procedencia: original
dificultad: basico
habilidades: [conceptual]
resumen: Distingir una identitat d’una equació.
enunciado: Només una d’aquestes igualtats és una identitat (es compleix per a tot $x$).
apartados:
  - id: a
    enunciado: Quina?
    respuesta:
      tipo: opciones
      opciones:
        - { texto: '$\sin 2x = 2\sin x$', explicacion: 'Contraexemple: amb $x = 90^\circ$, $\sin 180^\circ = 0$ però $2\sin 90^\circ = 2$. És una equació (es compleix només per a alguns $x$).' }
        - { texto: '$(\sin x + \cos x)^2 = 1 + \sin 2x$', correcta: true, explicacion: 'Desenvolupant: $\sin^2 x + 2\sin x\cos x + \cos^2 x = 1 + 2\sin x\cos x = 1 + \sin 2x$, per a tot $x$.' }
        - { texto: '$\cos 2x = 1$', explicacion: 'Només es compleix si $2x$ és un nombre enter de voltes: a $0^\circ$ i $180^\circ$ de la primera volta. És una equació.' }
        - { texto: '$\sin x + \cos x = 1$', explicacion: 'Amb $x = 45^\circ$ val $\sqrt2 \ne 1$. És una equació (solucions $0^\circ$ i $90^\circ$ a la primera volta).' }
    pistas:
      - 'Busca un contraexemple per a cadascuna. La que no en tingui cap, demostra-la.'
    pasos:
      - titulo: Desenvolupar el quadrat
        desarrollo: '$$(\sin x + \cos x)^2 = \sin^2 x + \cos^2 x + 2\sin x\cos x = 1 + \sin 2x$$'
        porque: 'Es fan servir la identitat fonamental i l’angle doble, que valen per a tot $x$.'
    resultado: 'La identitat és $(\sin x + \cos x)^2 = 1 + \sin 2x$.'
