titulo: 'sin 2x = cos x'
tema: identidades-ecuaciones
orden: 9
procedencia: original
dificultad: intermedio
habilidades: [calculo, metodo]
resumen: Angle doble i factor comú. Dividir entre cos x faria perdre dues solucions.
enunciado: 'Resol a $[0^\circ,\ 360^\circ)$: $\quad\sin 2x = \cos x$'
apartados:
  - id: a
    enunciado: Escriu totes les solucions.
    respuesta:
      tipo: conjunto
      valores: [30, 90, 150, 270]
      trampas:
        - { valores: [30, 150], explicacion: 'Has dividit entre $\cos x$ i has perdut les solucions de $\cos x = 0$: $90^\circ$ i $270^\circ$.' }
        - { valores: [90, 270], explicacion: 'Et falta el segon factor: $2\sin x - 1 = 0$.' }
    pistas:
      - '$\sin 2x = 2\sin x\cos x$.'
      - 'Passa-ho tot a un costat i treu $\cos x$ factor comú.'
    pasos:
      - titulo: Angle doble
        desarrollo: '$$2\sin x\cos x = \cos x \;\Rightarrow\; 2\sin x\cos x - \cos x = 0$$'
      - titulo: Factor comú
        desarrollo: '$$\cos x\,(2\sin x - 1) = 0$$'
        porque: 'No es divideix entre $\cos x$: podria valer 0.'
      - titulo: Els dos factors
        desarrollo: |
          - $\cos x = 0 \Rightarrow x = 90^\circ,\ 270^\circ$.
          - $\sin x = \frac12 \Rightarrow x = 30^\circ,\ 150^\circ$.
    resultado: '$x = 30^\circ,\ 90^\circ,\ 150^\circ,\ 270^\circ$.'
