titulo: L’altura d’un edifici
tema: razones-trigonometricas
rol: ejemplo
orden: 3
procedencia: original
dificultad: basico
habilidades: [planteamiento, modelizacion]
resumen: Angle d’elevació, tangent i no oblidar l’altura dels ulls.
enunciado: |
  Una estudiant es col·loca a $40\un{m}$ del peu d’un edifici i mira la part més alta amb un angle d’elevació de $32^\circ$. Els seus ulls són a $1{,}6\un{m}$ del terra. Quant fa l’edifici?
figura:
  tipo: geometria
  puntos:
    - { id: O, x: 0, y: 1.6, etiqueta: 'ulls', lado: o }
    - { id: S, x: 0, y: 0, etiqueta: '', marca: false }
    - { id: B, x: 40, y: 0, etiqueta: '', marca: false }
    - { id: H, x: 40, y: 1.6, etiqueta: '', marca: false }
    - { id: T, x: 40, y: 26.59, etiqueta: 'T', lado: e }
  segmentos:
    - { de: S, a: O, etiqueta: '1,6 m', lado: izquierda }
    - { de: O, a: H, etiqueta: '40 m', color: x, discontinuo: true, lado: derecha }
    - { de: H, a: T, etiqueta: 'x = ?', color: y, lado: derecha }
    - { de: B, a: H, color: v }
    - { de: O, a: T, color: v, discontinuo: true }
  angulos:
    - { vertice: O, desde: H, hasta: T, etiqueta: '32°', color: g, radio: 50 }
    - { vertice: H, desde: O, hasta: T, recto: true }
  suelo: { y: 0, desde: -4, hasta: 46 }
datos:
  - { simbolo: 'd', valor: '40\un{m}', significado: 'distància horitzontal a l’edifici' }
  - { simbolo: '\alpha', valor: '32^\circ', significado: 'angle d’elevació' }
  - { simbolo: 'h_0', valor: '1{,}6\un{m}', significado: 'altura dels ulls' }
incognitas:
  - 'L’altura total de l’edifici, $H$.'
interpretacion: |
  L’**angle d’elevació** es mesura des de l’horitzontal dels ulls cap amunt. Es forma un triangle rectangle el catet contigu del qual són els $40\un{m}$ i el catet oposat del qual és la part de l’edifici que hi ha **per sobre dels ulls**. A això cal sumar-hi $1{,}6\un{m}$.
apartados:
  - id: a
    enunciado: Calcula l’altura de l’edifici.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'H'
          etiqueta: altura de l’edifici
          unidad: m
          valor: 26.59
          trampas:
            - valor: 24.99
              explicacion: 'És la part de l’edifici que hi ha per sobre dels ulls. Et falta sumar-hi $1{,}6\un{m}$.'
            - valor: 21.20
              explicacion: 'Has fet servir el sinus. Els $40\un{m}$ són el catet contigu, no la hipotenusa: la raó que uneix els dos catets és la tangent.'
    pasos:
      - titulo: Triar la raó
        piensa: 'Coneixes el catet contigu i busques l’oposat. Quina raó els relaciona?'
        desarrollo: '$$\tan 32^\circ = \frac{\cy{x}}{\cx{40}}$$'
        porque: 'La tangent és la raó entre els dos catets.'
      - titulo: Aïllar
        desarrollo: '$$x = 40\cdot\tan 32^\circ \approx 40\cdot 0{,}6249 \approx 24{,}99\un{m}$$'
      - titulo: Sumar l’altura dels ulls
        desarrollo: '$$H = 24{,}99 + 1{,}6 \approx 26{,}59\un{m}$$'
        porque: 'El triangle comença a l’altura dels ulls, no a terra.'
    resultado: 'L’edifici fa uns $26{,}6\un{m}$.'
errores:
  - error: 'Oblidar l’altura de l’observador'
    explicacion: 'L’angle es mesura des dels ulls. Si l’enunciat dona aquesta altura, cal sumar-la.'
