titulo: Valors exactes sense calculadora
tema: razones-trigonometricas
rol: ejemplo
orden: 2
procedencia: original
dificultad: intermedio
habilidades: [calculo, graficas]
resumen: Treure voltes, mirar el quadrant i buscar l’angle de referència.
enunciado: |
  Calcula el valor exacte, sense calculadora, de:
  $$\text{a) } \sin 240^\circ \qquad \text{b) } \cos 315^\circ \qquad \text{c) } \tan 870^\circ$$
apartados:
  - id: a
    enunciado: '$\sin 240^\circ$'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\sin 240^\circ', etiqueta: valor (decimal), unidad: '', valor: -0.8660, tolerancia: 0.005 }
    pasos:
      - titulo: Quadrant i signe
        piensa: On és el punt de 240°?
        desarrollo: '$240^\circ$ és entre $180^\circ$ i $270^\circ$: **tercer quadrant**, on el sinus és **negatiu**.'
      - titulo: Angle de referència
        desarrollo: '$240^\circ = 180^\circ + 60^\circ$, així que l’angle de referència és $60^\circ$.'
        porque: 'És l’angle agut amb l’eix $X$: el que passa de $180^\circ$.'
      - titulo: Resultat
        desarrollo: '$$\sin 240^\circ = -\sin 60^\circ = -\frac{\sqrt3}{2}$$'
    resultado: '$\sin 240^\circ = -\dfrac{\sqrt3}{2} \approx -0{,}866$.'
  - id: b
    enunciado: '$\cos 315^\circ$'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\cos 315^\circ', etiqueta: valor (decimal), unidad: '', valor: 0.7071, tolerancia: 0.005 }
    pasos:
      - titulo: Quadrant, signe i referència
        piensa: Quant li falta a 315° per a la volta completa?
        desarrollo: '$315^\circ$ és al **quart quadrant**: cosinus **positiu**. $315^\circ = 360^\circ - 45^\circ$: referència $45^\circ$.'
      - titulo: Resultat
        desarrollo: '$$\cos 315^\circ = \cos 45^\circ = \frac{\sqrt2}{2}$$'
    resultado: '$\cos 315^\circ = \dfrac{\sqrt2}{2} \approx 0{,}707$.'
  - id: c
    enunciado: '$\tan 870^\circ$'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\tan 870^\circ', etiqueta: valor (decimal), unidad: '', valor: -0.5774, tolerancia: 0.005 }
    pasos:
      - titulo: Treure les voltes completes
        piensa: '870° és més de dues voltes. A quin angle de la primera volta equival?'
        desarrollo: '$870^\circ - 2\cdot 360^\circ = 150^\circ$, així que $\tan 870^\circ = \tan 150^\circ$.'
        porque: 'Els angles coterminals tenen les mateixes raons.'
      - titulo: Quadrant, signe i referència
        desarrollo: '$150^\circ$: **segon quadrant**, tangent **negativa**. Referència: $180^\circ - 150^\circ = 30^\circ$.'
      - titulo: Resultat
        desarrollo: '$$\tan 870^\circ = -\tan 30^\circ = -\frac{\sqrt3}{3}$$'
    resultado: '$\tan 870^\circ = -\dfrac{\sqrt3}{3} \approx -0{,}577$.'
errores:
  - error: 'Prendre l’angle de referència respecte de l’eix Y'
    explicacion: 'Per a $240^\circ$ la referència és $60^\circ$ (amb l’eix $X$), no $30^\circ$. Si fas servir $30^\circ$ obtens $-\frac12$, que és incorrecte.'
