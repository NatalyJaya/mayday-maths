titulo: L’escala recolzada a la paret
tema: razones-trigonometricas
orden: 8
procedencia: original
dificultad: basico
habilidades: [planteamiento, modelizacion, geometria]
resumen: Hipotenusa i angle coneguts; els dos catets.
enunciado: |
  Una escala de $6\un{m}$ està recolzada en una paret vertical i forma un angle de $70^\circ$ amb el terra. A quina altura toca la paret? A quina distància de la paret és el peu de l’escala?
figura:
  tipo: geometria
  puntos:
    - { id: A, x: 2.052, y: 0, etiqueta: 'peu', lado: s }
    - { id: O, x: 0, y: 0, etiqueta: '', marca: false }
    - { id: T, x: 0, y: 5.638, etiqueta: '', marca: false }
  segmentos:
    - { de: A, a: T, etiqueta: '6 m', lado: derecha }
    - { de: O, a: T, etiqueta: 'h = ?', color: y }
    - { de: O, a: A, etiqueta: 'd = ?', color: x, lado: derecha }
  angulos:
    - { vertice: A, desde: T, hasta: O, etiqueta: '70°', color: g, radio: 30 }
    - { vertice: O, desde: A, hasta: T, recto: true }
  suelo: { y: 0, desde: -0.3, hasta: 3 }
apartados:
  - id: a
    enunciado: Calcula l’altura $h$ i la distància $d$.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'h'
          etiqueta: altura a la paret
          unidad: m
          valor: 5.64
          trampas:
            - { valor: 2.05, explicacion: 'Has intercanviat sinus i cosinus. L’altura és el catet oposat a l’angle de $70^\circ$: $h = 6\sin 70^\circ$.' }
        - simbolo: 'd'
          etiqueta: distància del peu a la paret
          unidad: m
          valor: 2.05
          trampas:
            - { valor: 5.64, explicacion: 'Has intercanviat sinus i cosinus. La distància al peu és el catet contigu: $d = 6\cos 70^\circ$.' }
    pistas:
      - 'L’escala és la hipotenusa. Quin catet és oposat a l’angle de $70^\circ$?'
    pasos:
      - titulo: Altura (catet oposat)
        desarrollo: '$$h = 6\cdot\sin 70^\circ \approx 6\cdot 0{,}9397 \approx 5{,}64\un{m}$$'
      - titulo: Distància (catet contigu)
        desarrollo: '$$d = 6\cdot\cos 70^\circ \approx 6\cdot 0{,}3420 \approx 2{,}05\un{m}$$'
        porque: 'Comprovació amb Pitàgores: $5{,}64^2 + 2{,}05^2 \approx 36$ ✔.'
    resultado: 'Toca la paret a uns $5{,}64\un{m}$ i el peu és a uns $2{,}05\un{m}$ de la paret.'
