titulo: Todo a partir de sin 25°
tema: razones-trigonometricas
orden: 14
procedencia: original
dificultad: examen
habilidades: [metodo, conceptual, calculo]
resumen: Elegir en cada caso la relación entre ángulos que lleva a 25°.
enunciado: |
  Sabiendo que $\sin 25^\circ \approx 0{,}4226$ y **sin usar las teclas trigonométricas de la calculadora**, calcula:
  $$\text{a) } \sin 155^\circ \qquad \text{b) } \cos 65^\circ \qquad \text{c) } \cos 115^\circ \qquad \text{d) } \sin 205^\circ$$
conceptos:
  - 'Suplementarios: $\sin(180^\circ - \alpha) = \sin\alpha$.'
  - 'Complementarios: $\cos(90^\circ - \alpha) = \sin\alpha$.'
  - 'Diferencia de $180^\circ$: $\sin(180^\circ + \alpha) = -\sin\alpha$.'
apartados:
  - id: a
    enunciado: Calcula los cuatro valores.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\sin 155^\circ', etiqueta: '', unidad: '', valor: 0.4226, tolerancia: 0.005 }
        - { simbolo: '\cos 65^\circ', etiqueta: '', unidad: '', valor: 0.4226, tolerancia: 0.005 }
        - { simbolo: '\cos 115^\circ', etiqueta: '', unidad: '', valor: -0.4226, tolerancia: 0.005 }
        - { simbolo: '\sin 205^\circ', etiqueta: '', unidad: '', valor: -0.4226, tolerancia: 0.005 }
    pistas:
      - '$155^\circ = 180^\circ - 25^\circ$, $65^\circ = 90^\circ - 25^\circ$.'
      - '$115^\circ = 90^\circ + 25^\circ$: el punto está en el segundo cuadrante, coseno negativo.'
      - '$205^\circ = 180^\circ + 25^\circ$: tercer cuadrante, seno negativo.'
    pasos:
      - titulo: sin 155°
        desarrollo: '$\sin 155^\circ = \sin(180^\circ - 25^\circ) = \sin 25^\circ \approx 0{,}4226$.'
        porque: 'Simetría respecto al eje $Y$: misma altura.'
      - titulo: cos 65°
        desarrollo: '$\cos 65^\circ = \cos(90^\circ - 25^\circ) = \sin 25^\circ \approx 0{,}4226$.'
        porque: 'El coseno de un ángulo es el seno de su complementario.'
      - titulo: cos 115°
        desarrollo: '$\cos 115^\circ = -\cos 65^\circ = -\sin 25^\circ \approx -0{,}4226$.'
        porque: '$115^\circ$ y $65^\circ$ son suplementarios: el coseno cambia de signo.'
      - titulo: sin 205°
        desarrollo: '$\sin 205^\circ = \sin(180^\circ + 25^\circ) = -\sin 25^\circ \approx -0{,}4226$.'
        porque: 'Simetría respecto al origen: las dos coordenadas cambian de signo.'
    resultado: '$0{,}4226$; $0{,}4226$; $-0{,}4226$; $-0{,}4226$.'
