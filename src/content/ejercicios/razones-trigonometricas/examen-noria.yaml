titulo: L’altura d’una cabina de sínia
tema: razones-trigonometricas
orden: 15
procedencia: original
dificultad: examen
habilidades: [modelizacion, graficas, multipaso]
resumen: Un model amb el sinus, una altura concreta i els angles per a una altura donada.
enunciado: |
  Una sínia té $18\un{m}$ de radi i el seu centre és a $20\un{m}$ de terra. Mesurem l’angle de gir $\theta$ d’una cabina des de la posició horitzontal de la dreta, en sentit antihorari. La seva altura sobre el terra és
  $$h(\theta) = 20 + 18\sin\theta$$

  a) A quina altura és la cabina quan $\theta = 210^\circ$?
  b) Per a quins angles de la primera volta ($0^\circ \le \theta < 360^\circ$) és a $29\un{m}$ d’altura?
figura:
  tipo: funcion
  rango: [0, 40]
  curvas:
    - { f: sin, a: 18, d: 20, etiqueta: 'h(θ) = 20 + 18 sin θ', color: y }
  niveles:
    - { y: 29, etiqueta: 'h = 29 m' }
interpretacion: |
  La cabina recorre una circumferència de radi 18 al voltant d’un centre a 20 m d’altura. La seva altura respecte del centre és $18\sin\theta$ (el sinus és l’ordenada en una circumferència de radi 1; amb radi 18 es multiplica per 18).
apartados:
  - id: a
    enunciado: Altura per a $\theta = 210^\circ$.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'h(210^\circ)', etiqueta: altura, unidad: m, valor: 11, trampas: [{ valor: 29, explicacion: '$\sin 210^\circ$ és negatiu (tercer quadrant): la cabina és per sota del centre.' }] }
    pistas:
      - '$\sin 210^\circ = -\sin 30^\circ$.'
    pasos:
      - titulo: Substituir
        desarrollo: '$$h(210^\circ) = 20 + 18\sin 210^\circ = 20 + 18\cdot\left(-\frac12\right) = 11\un{m}$$'
    resultado: 'La cabina és a $11\un{m}$ de terra.'
  - id: b
    enunciado: Angles per als quals $h = 29\un{m}$.
    respuesta:
      tipo: conjunto
      simbolo: '\theta'
      valores: [30, 150]
      trampas:
        - { valores: [30], explicacion: 'La cabina passa dues vegades per aquesta altura a cada volta: una pujant i una altra baixant.' }
    pistas:
      - 'Planteja $20 + 18\sin\theta = 29$ i aïlla el sinus.'
    pasos:
      - titulo: Plantejar i aïllar
        desarrollo: '$$20 + 18\sin\theta = 29 \;\Rightarrow\; \sin\theta = \frac{9}{18} = \frac12$$'
      - titulo: Els dos angles
        desarrollo: '$\theta = 30^\circ$ (pujant) i $\theta = 150^\circ$ (baixant).'
        porque: 'Una recta horitzontal talla la circumferència en dos punts: els dos angles amb el mateix sinus.'
    resultado: 'A $\theta = 30^\circ$ i a $\theta = 150^\circ$.'
