titulo: Existeix aquest angle?
tema: razones-trigonometricas
orden: 10
procedencia: original
dificultad: intermedio
habilidades: [conceptual]
resumen: La identitat fonamental com a comprovació.
enunciado: |
  Un company diu que ha trobat un angle amb $\sin\alpha = 0{,}6$ i $\cos\alpha = 0{,}7$.
apartados:
  - id: a
    enunciado: És possible?
    respuesta:
      tipo: opciones
      opciones:
        - { texto: 'Sí, perquè els dos valors són entre −1 i 1.', explicacion: 'Ser entre $-1$ i $1$ és necessari, però no suficient. A més, sinus i cosinus han de complir la identitat fonamental.' }
        - { texto: 'No, perquè 0,6² + 0,7² no dona 1.', correcta: true, explicacion: '$0{,}36 + 0{,}49 = 0{,}85 \ne 1$. Per a qualsevol angle, $\sin^2\alpha + \cos^2\alpha = 1$: el punt $(0{,}7;\ 0{,}6)$ no és a la circumferència de radi 1.' }
        - { texto: 'No, perquè 0,6 + 0,7 no dona 1.', explicacion: 'Que sinus i cosinus sumin 1 no és cap regla (per a $45^\circ$ sumen $\sqrt2$). El que suma 1 són els seus quadrats.' }
        - { texto: 'Sí, és un angle d’uns 40°.', explicacion: '$\sin 40^\circ \approx 0{,}64$ i $\cos 40^\circ \approx 0{,}77$. Cap angle no té alhora aquests dos valors.' }
    pistas:
      - 'Comprova la identitat fonamental.'
    pasos:
      - titulo: Comprovar la identitat
        desarrollo: '$$0{,}6^2 + 0{,}7^2 = 0{,}36 + 0{,}49 = 0{,}85 \ne 1$$'
    resultado: 'No existeix cap angle així.'
