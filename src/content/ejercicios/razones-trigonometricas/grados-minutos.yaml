titulo: Graus, minuts i segons
tema: razones-trigonometricas
orden: 5
procedencia: original
dificultad: basico
habilidades: [calculo]
resumen: Passar un angle decimal a graus, minuts i segons.
enunciado: Expressa l’angle $47{,}36^\circ$ en graus, minuts i segons.
conceptos:
  - '$1^\circ = 60''$ i $1'' = 60''''$.'
apartados:
  - id: a
    enunciado: Escriu els graus, els minuts i els segons.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\text{graus}', etiqueta: graus, unidad: '°', valor: 47, tolerancia_abs: 0.01, tolerancia: 0.001 }
        - simbolo: '\text{minuts}'
          etiqueta: minuts
          unidad: "′"
          valor: 21
          tolerancia: 0.001
          trampas:
            - { valor: 36, explicacion: 'Has pres els decimals com si ja fossin minuts. $0{,}36^\circ$ no són 36 minuts: cal multiplicar per 60.' }
            - { valor: 21.6, tolerancia: 0.001, explicacion: '$21{,}6''$: els minuts han de ser enters. Passa els $0{,}6''$ a segons.' }
        - { simbolo: '\text{segons}', etiqueta: segons, unidad: "″", valor: 36, tolerancia: 0.001 }
    pistas:
      - 'La part entera són els graus. Multiplica la part decimal per 60.'
      - '$0{,}36\cdot 60 = 21{,}6$: 21 minuts i $0{,}6$ de minut.'
    pasos:
      - titulo: Graus
        desarrollo: 'La part entera: $47^\circ$.'
      - titulo: Minuts
        desarrollo: '$$0{,}36^\circ\cdot 60 = 21{,}6'' \;\Rightarrow\; 21''$$'
      - titulo: Segons
        desarrollo: '$$0{,}6''\cdot 60 = 36''''$$'
    resultado: '$47{,}36^\circ = 47^\circ\,21''\,36''''$.'
