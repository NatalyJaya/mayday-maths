titulo: De graus a radiants i al revés
tema: razones-trigonometricas
orden: 1
procedencia: original
dificultad: basico
habilidades: [calculo]
resumen: Tres conversions amb l’equivalència 180° = π rad.
enunciado: |
  Expressa:

  a) $135^\circ$ en radiants. &nbsp; b) $\dfrac{5\pi}{6}$ rad en graus. &nbsp; c) $2$ rad en graus.
conceptos:
  - '$180^\circ = \pi \text{ rad}$.'
  - 'De graus a radiants: multiplica per $\dfrac{\pi}{180^\circ}$. De radiants a graus: multiplica per $\dfrac{180^\circ}{\pi}$.'
apartados:
  - id: a
    enunciado: '$135^\circ$ en radiants (escriu el valor decimal).'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: '135^\circ'
          etiqueta: en radiants
          unidad: rad
          valor: 2.3562
          tolerancia: 0.005
          trampas:
            - { valor: 7734.8, explicacion: 'Has multiplicat per $\frac{180}{\pi}$ en lloc de per $\frac{\pi}{180}$. En passar a radiants el nombre es fa més petit.' }
    pistas:
      - '$135^\circ \cdot \dfrac{\pi}{180^\circ}$. Simplifica la fracció $\frac{135}{180}$.'
    pasos:
      - titulo: Multiplicar per π/180
        desarrollo: '$$135^\circ\cdot\frac{\pi}{180^\circ} = \frac{135\pi}{180} = \frac{3\pi}{4} \approx 2{,}356\un{rad}$$'
        porque: '$\frac{135}{180} = \frac34$ (dividint entre 45).'
    resultado: '$135^\circ = \dfrac{3\pi}{4}\un{rad} \approx 2{,}356\un{rad}$.'
  - id: b
    enunciado: '$\dfrac{5\pi}{6}$ rad en graus.'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\tfrac{5\pi}{6}', etiqueta: en graus, unidad: '°', valor: 150 }
    pistas:
      - 'Substitueix $\pi$ per $180^\circ$.'
    pasos:
      - titulo: Canviar π per 180°
        desarrollo: '$$\frac{5\pi}{6} = \frac{5\cdot 180^\circ}{6} = 150^\circ$$'
        porque: 'Com que $\pi \text{ rad} = 180^\circ$, en una expressió amb $\pi$ n’hi ha prou de substituir-lo.'
    resultado: '$\dfrac{5\pi}{6}\un{rad} = 150^\circ$.'
  - id: c
    enunciado: '$2$ rad en graus.'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: '2\text{ rad}'
          etiqueta: en graus
          unidad: '°'
          valor: 114.59
          trampas:
            - { valor: 360, explicacion: '$2$ rad no és el mateix que $2\pi$ rad. Aquí no hi ha $\pi$: és un nombre de radis.' }
            - { valor: 0.0349, explicacion: 'Has multiplicat per $\frac{\pi}{180}$: això passa de graus a radiants.' }
    pistas:
      - 'Aquí no hi apareix $\pi$: multiplica per $\dfrac{180^\circ}{\pi}$.'
    pasos:
      - titulo: Multiplicar per 180/π
        desarrollo: '$$2\cdot\frac{180^\circ}{\pi} = \frac{360^\circ}{\pi} \approx 114{,}59^\circ$$'
        porque: 'Un radiant són uns $57{,}3^\circ$; dos radiants, el doble.'
    resultado: '$2\un{rad} \approx 114{,}59^\circ$.'
errores:
  - error: 'Confondre «2 rad» amb «2π rad»'
    explicacion: 'Un angle en radiants no ha de portar $\pi$ necessàriament. $2\pi$ rad és una volta completa; $2$ rad és una mica menys d’un terç de volta.'
