titulo: Reducció al primer quadrant
tema: razones-trigonometricas
orden: 7
procedencia: original
dificultad: intermedio
habilidades: [calculo, graficas]
resumen: Un angle de cada tipus, inclòs un de negatiu.
enunciado: |
  Calcula el valor exacte de: a) $\sin 330^\circ$ &nbsp; b) $\cos(-120^\circ)$ &nbsp; c) $\tan 225^\circ$
apartados:
  - id: a
    enunciado: '$\sin 330^\circ$ (escriu el decimal).'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\sin 330^\circ', etiqueta: valor, unidad: '', valor: -0.5, trampas: [{ valor: -0.866, explicacion: 'L’angle de referència de $330^\circ$ és $30^\circ$ (amb l’eix $X$), no $60^\circ$.' }] }
    pistas:
      - '$330^\circ = 360^\circ - 30^\circ$. Quin signe té el sinus al quart quadrant?'
    pasos:
      - titulo: Referència i signe
        desarrollo: '$$\sin 330^\circ = \sin(360^\circ - 30^\circ) = -\sin 30^\circ = -\frac12$$'
        porque: 'Quart quadrant: el punt és per sota de l’eix $X$, sinus negatiu.'
    resultado: '$\sin 330^\circ = -\frac12$.'
  - id: b
    enunciado: '$\cos(-120^\circ)$'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\cos(-120^\circ)', etiqueta: valor, unidad: '', valor: -0.5, trampas: [{ valor: 0.5, explicacion: 'El cosinus és parell, $\cos(-120^\circ) = \cos 120^\circ$, però $120^\circ$ és al segon quadrant, on el cosinus és negatiu.' }] }
    pistas:
      - 'El cosinus és parell: $\cos(-x) = \cos x$.'
      - '$-120^\circ$ porta al mateix punt que $240^\circ$.'
    pasos:
      - titulo: Treure el signe menys
        desarrollo: '$$\cos(-120^\circ) = \cos 120^\circ$$'
        porque: 'Girar $120^\circ$ en un sentit o en l’altre dona punts simètrics respecte de l’eix $X$: mateixa abscissa.'
      - titulo: Reduir
        desarrollo: '$$\cos 120^\circ = \cos(180^\circ - 60^\circ) = -\cos 60^\circ = -\frac12$$'
    resultado: '$\cos(-120^\circ) = -\frac12$.'
  - id: c
    enunciado: '$\tan 225^\circ$'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\tan 225^\circ', etiqueta: valor, unidad: '', valor: 1, trampas: [{ valor: -1, explicacion: 'Al tercer quadrant el sinus i el cosinus són negatius, així que el seu quocient és positiu.' }] }
    pistas:
      - '$225^\circ = 180^\circ + 45^\circ$.'
    pasos:
      - titulo: Referència i signe
        desarrollo: '$$\tan 225^\circ = \tan(180^\circ + 45^\circ) = \tan 45^\circ = 1$$'
        porque: 'La tangent es repeteix cada $180^\circ$.'
    resultado: '$\tan 225^\circ = 1$.'
