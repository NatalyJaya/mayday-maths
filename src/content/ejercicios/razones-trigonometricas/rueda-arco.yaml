titulo: Quant avança una roda
tema: razones-trigonometricas
orden: 9
procedencia: original
dificultad: intermedio
habilidades: [modelizacion, conceptual]
resumen: La longitud d’un arc és angle (en radiants) per radi.
enunciado: |
  Una roda de $30\un{cm}$ de radi gira, sense lliscar, un angle de $2{,}5$ rad.

  a) Quants centímetres avança?
  b) Quants graus ha girat?
conceptos:
  - 'Longitud d’arc: $s = \theta\cdot r$, amb $\theta$ en **radiants**.'
  - 'Una roda que gira sense lliscar avança exactament la longitud de l’arc que toca a terra.'
apartados:
  - id: a
    enunciado: Distància que avança.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 's'
          etiqueta: avanç
          unidad: cm
          valor: 75
          trampas:
            - { valor: 1.309, explicacion: 'Has tractat 2,5 com si fossin graus i els has passat a radiants. L’angle ja és en radiants: $s = 2{,}5 \cdot 30$.' }
            - { valor: 4296.9, explicacion: 'Has fet servir l’angle en graus ($143{,}2^\circ$). A $s = \theta r$ l’angle va en radiants.' }
    pistas:
      - 'Un radiant és l’angle l’arc del qual mesura un radi. Quant mesura l’arc de 2,5 radiants?'
    pasos:
      - titulo: Longitud d’arc
        desarrollo: '$$s = \theta\cdot r = 2{,}5\cdot 30 = 75\un{cm}$$'
        porque: 'Per definició de radiant: cada radiant de gir correspon a un arc d’un radi.'
    resultado: 'Avança $75\un{cm}$.'
  - id: b
    enunciado: Angle girat en graus.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\theta', etiqueta: angle, unidad: '°', valor: 143.24 }
    pasos:
      - titulo: Conversió
        desarrollo: '$$2{,}5\cdot\frac{180^\circ}{\pi} \approx 143{,}24^\circ$$'
    resultado: 'Ha girat uns $143{,}24^\circ$, una mica menys de mitja volta.'
