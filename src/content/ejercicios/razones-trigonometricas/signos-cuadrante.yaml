titulo: ¿En qué cuadrante está?
tema: razones-trigonometricas
orden: 4
procedencia: original
dificultad: basico
habilidades: [conceptual, graficas]
resumen: Deducir el cuadrante a partir de los signos.
enunciado: Un ángulo $\alpha$ cumple $\sin\alpha < 0$ y $\tan\alpha > 0$.
apartados:
  - id: a
    enunciado: ¿En qué cuadrante está $\alpha$?
    respuesta:
      tipo: opciones
      opciones:
        - { texto: 'Primero', explicacion: 'En el primer cuadrante el seno es positivo.' }
        - { texto: 'Segundo', explicacion: 'En el segundo cuadrante el seno es positivo y la tangente negativa: justo al revés.' }
        - { texto: 'Tercero', correcta: true, explicacion: 'Seno negativo: tercer o cuarto cuadrante. Tangente positiva: seno y coseno con el mismo signo, así que el coseno también es negativo. Eso es el tercer cuadrante.' }
        - { texto: 'Cuarto', explicacion: 'En el cuarto cuadrante el seno es negativo, pero el coseno es positivo, así que la tangente sería negativa.' }
    pistas:
      - '¿Dónde está el punto $P$ si su ordenada es negativa?'
      - 'Si $\tan\alpha = \frac{\sin\alpha}{\cos\alpha} > 0$, ¿qué signo tiene $\cos\alpha$?'
    pasos:
      - titulo: Signo del seno
        desarrollo: '$\sin\alpha < 0$: el punto $P$ está por debajo del eje $X$, en el III o el IV cuadrante.'
      - titulo: Signo de la tangente
        desarrollo: '$\tan\alpha > 0$ y $\sin\alpha < 0$, así que $\cos\alpha < 0$: $P$ está a la izquierda del eje $Y$.'
    resultado: '$\alpha$ está en el **tercer cuadrante**.'
