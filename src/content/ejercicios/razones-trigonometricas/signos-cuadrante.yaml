titulo: A quin quadrant és?
tema: razones-trigonometricas
orden: 4
procedencia: original
dificultad: basico
habilidades: [conceptual, graficas]
resumen: Deduir el quadrant a partir dels signes.
enunciado: Un angle $\alpha$ compleix $\sin\alpha < 0$ i $\tan\alpha > 0$.
apartados:
  - id: a
    enunciado: A quin quadrant és $\alpha$?
    respuesta:
      tipo: opciones
      opciones:
        - { texto: 'Primer', explicacion: 'Al primer quadrant el sinus és positiu.' }
        - { texto: 'Segon', explicacion: 'Al segon quadrant el sinus és positiu i la tangent negativa: just al revés.' }
        - { texto: 'Tercer', correcta: true, explicacion: 'Sinus negatiu: tercer o quart quadrant. Tangent positiva: sinus i cosinus amb el mateix signe, així que el cosinus també és negatiu. Això és el tercer quadrant.' }
        - { texto: 'Quart', explicacion: 'Al quart quadrant el sinus és negatiu, però el cosinus és positiu, així que la tangent seria negativa.' }
    pistas:
      - 'On és el punt $P$ si la seva ordenada és negativa?'
      - 'Si $\tan\alpha = \frac{\sin\alpha}{\cos\alpha} > 0$, quin signe té $\cos\alpha$?'
    pasos:
      - titulo: Signe del sinus
        desarrollo: '$\sin\alpha < 0$: el punt $P$ és per sota de l’eix $X$, al quadrant III o IV.'
      - titulo: Signe de la tangent
        desarrollo: '$\tan\alpha > 0$ i $\sin\alpha < 0$, així que $\cos\alpha < 0$: $P$ és a l’esquerra de l’eix $Y$.'
    resultado: '$\alpha$ és al **tercer quadrant**.'
