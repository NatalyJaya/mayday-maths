titulo: Simplifica amb les relacions fonamentals
tema: razones-trigonometricas
orden: 11
procedencia: original
dificultad: avanzado
habilidades: [calculo, demostracion]
resumen: Reconèixer 1 − cos²α i escriure-ho tot amb sinus i cosinus.
enunciado: |
  Simplifica l’expressió (per als angles en què té sentit):
  $$\frac{1 - \cos^2\alpha}{\sin\alpha\cdot\cos\alpha}$$
apartados:
  - id: a
    enunciado: A què és igual?
    respuesta:
      tipo: opciones
      opciones:
        - { texto: '$\tan\alpha$', correcta: true, explicacion: '$1 - \cos^2\alpha = \sin^2\alpha$, i $\frac{\sin^2\alpha}{\sin\alpha\cos\alpha} = \frac{\sin\alpha}{\cos\alpha}$.' }
        - { texto: '$\sin\alpha$', explicacion: 'En simplificar queda $\frac{\sin\alpha}{\cos\alpha}$: el cosinus del denominador no desapareix.' }
        - { texto: '$\dfrac{1}{\tan\alpha}$', explicacion: 'Revisa què queda a dalt: $\sin^2\alpha$. En simplificar un sinus, l’altre continua al numerador.' }
        - { texto: '$1 - \cos\alpha$', explicacion: 'No es pot «ratllar» el cosinus de $\cos^2\alpha$ amb el del denominador: a dalt hi ha una resta, no un producte.' }
    pistas:
      - 'A què és igual $1 - \cos^2\alpha$?'
      - 'Escriu $\sin^2\alpha = \sin\alpha\cdot\sin\alpha$ i simplifica.'
    pasos:
      - titulo: Identitat fonamental
        desarrollo: '$$\frac{1 - \cos^2\alpha}{\sin\alpha\cos\alpha} = \frac{\sin^2\alpha}{\sin\alpha\cos\alpha}$$'
        porque: 'De $\sin^2\alpha + \cos^2\alpha = 1$ s’aïlla $\sin^2\alpha = 1 - \cos^2\alpha$.'
      - titulo: Simplificar
        desarrollo: '$$\frac{\sin\alpha\cdot\sin\alpha}{\sin\alpha\cdot\cos\alpha} = \frac{\sin\alpha}{\cos\alpha} = \tan\alpha$$'
        porque: 'Ara sí que són productes: es pot simplificar el factor $\sin\alpha$ (si $\sin\alpha \ne 0$).'
    resultado: '$\dfrac{1 - \cos^2\alpha}{\sin\alpha\cos\alpha} = \tan\alpha$.'
errores:
  - error: 'Simplificar termes d’una suma o d’una resta'
    explicacion: 'Només se simplifiquen **factors**. Per això primer cal convertir $1 - \cos^2\alpha$ en un producte ($\sin\alpha\cdot\sin\alpha$).'
