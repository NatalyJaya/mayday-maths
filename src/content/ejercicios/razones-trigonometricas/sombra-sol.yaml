titulo: L’ombra que s’escurça
tema: razones-trigonometricas
orden: 12
procedencia: original
dificultad: avanzado
habilidades: [modelizacion, multipaso, planteamiento]
resumen: Del triangle a l’angle i de l’angle a una nova longitud.
enunciado: |
  Un pal vertical de $5\un{m}$ projecta una ombra de $7{,}2\un{m}$.

  a) Amb quin angle d’elevació arriben els raigs del sol?
  b) Una estona després, el sol és $10^\circ$ més amunt. Quants metres s’ha escurçat l’ombra?
figura:
  tipo: triangulo
  a: 5
  b: 7.2
  c: 8.766
  base: b
  etiquetas: { a: '5 m', b: 'ombra: 7,2 m', A: 'α = ?' }
  colores: { a: y, b: x }
apartados:
  - id: a
    enunciado: Angle d’elevació del sol.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\alpha', etiqueta: angle d’elevació, unidad: '°', valor: 34.78, trampas: [{ valor: 55.22, explicacion: 'Aquest és l’angle de dalt del pal. L’angle d’elevació es mesura des de terra: l’ombra és el catet contigu.' }] }
    pistas:
      - 'El pal és el catet oposat a l’angle d’elevació i l’ombra, el contigu.'
    pasos:
      - titulo: Tangent
        desarrollo: '$$\tan\alpha = \frac{5}{7{,}2} \;\Rightarrow\; \alpha = \arctan\frac{5}{7{,}2} \approx 34{,}78^\circ$$'
    resultado: '$\alpha \approx 34{,}78^\circ$.'
  - id: b
    enunciado: Quant s’ha escurçat l’ombra?
    respuesta:
      tipo: numerica
      campos:
        - simbolo: '\Delta s'
          etiqueta: escurçament
          unidad: m
          valor: 2.16
          trampas:
            - { valor: 5.04, explicacion: 'Aquesta és la longitud de l’ombra nova. Es demana quant s’ha escurçat: resta-la de 7,2 m.' }
    pistas:
      - 'El nou angle és $34{,}78^\circ + 10^\circ = 44{,}78^\circ$. El pal continua fent 5 m.'
      - 'Ombra nova: $s = \dfrac{5}{\tan 44{,}78^\circ}$.'
    pasos:
      - titulo: Ombra nova
        desarrollo: '$$\tan 44{,}78^\circ = \frac{5}{s} \;\Rightarrow\; s = \frac{5}{\tan 44{,}78^\circ} \approx 5{,}04\un{m}$$'
        porque: 'El que no canvia és l’altura del pal; el que canvia és l’angle.'
      - titulo: Diferència
        desarrollo: '$$7{,}2 - 5{,}04 \approx 2{,}16\un{m}$$'
    resultado: 'L’ombra s’ha escurçat uns $2{,}16\un{m}$.'
errores:
  - error: 'Pensar que si l’angle augmenta 10°, l’ombra disminueix en proporció'
    explicacion: 'La longitud de l’ombra depèn de la tangent, que no és proporcional a l’angle. Cal recalcular-la.'
