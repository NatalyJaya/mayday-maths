titulo: Tangent positiva, sinus negatiu
tema: razones-trigonometricas
orden: 13
procedencia: original
dificultad: avanzado
habilidades: [calculo, conceptual, multipaso]
resumen: Deduir el quadrant a partir dels signes i calcular una expressió.
enunciado: |
  Sabent que $\tan\alpha = \dfrac34$ i que $\sin\alpha < 0$, calcula el valor exacte de $\sin\alpha + \cos\alpha$.
apartados:
  - id: a
    enunciado: '$\sin\alpha + \cos\alpha$ (escriu el decimal).'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: '\sin\alpha + \cos\alpha'
          etiqueta: valor
          unidad: ''
          valor: -1.4
          trampas:
            - { valor: 1.4, explicacion: 'Aquests són els valors del primer quadrant. Amb la tangent positiva i el sinus negatiu, $\alpha$ és al tercer quadrant: sinus i cosinus negatius.' }
            - { valor: -0.2, explicacion: 'Has posat el sinus negatiu però el cosinus positiu. Si la tangent és positiva, el sinus i el cosinus tenen el mateix signe.' }
    pistas:
      - 'A quin quadrant és $\alpha$?'
      - 'Amb $1 + \tan^2\alpha = \frac{1}{\cos^2\alpha}$ surt $\cos^2\alpha = \frac{16}{25}$.'
    pasos:
      - titulo: Quadrant
        desarrollo: '$\tan\alpha > 0$ i $\sin\alpha < 0$: $\cos\alpha < 0$ també. Tercer quadrant.'
      - titulo: Cosinus
        desarrollo: '$$1 + \frac{9}{16} = \frac{1}{\cos^2\alpha} \;\Rightarrow\; \cos^2\alpha = \frac{16}{25} \;\Rightarrow\; \cos\alpha = -\frac45$$'
      - titulo: Sinus i suma
        desarrollo: '$$\sin\alpha = \tan\alpha\cdot\cos\alpha = \frac34\cdot\left(-\frac45\right) = -\frac35 \qquad \sin\alpha + \cos\alpha = -\frac35 - \frac45 = -\frac75$$'
    resultado: '$\sin\alpha + \cos\alpha = -\dfrac75 = -1{,}4$.'
