titulo: Les tres raons en un triangle
tema: razones-trigonometricas
orden: 2
procedencia: original
dificultad: basico
habilidades: [calculo, geometria]
resumen: Pitàgores per a la hipotenusa i les definicions de sinus, cosinus i tangent.
enunciado: |
  Un triangle rectangle té catets de $8\un{cm}$ i $15\un{cm}$. Sigui $\alpha$ l’angle **oposat** al catet de $8\un{cm}$. Calcula $\sin\alpha$, $\cos\alpha$ i $\tan\alpha$, i el valor de $\alpha$.
figura:
  tipo: triangulo
  a: 8
  b: 15
  c: 17
  base: b
  etiquetas: { a: '8 cm', b: '15 cm', c: '?', A: 'α' }
  colores: { a: y, b: x }
conceptos:
  - 'Teorema de Pitàgores.'
  - '$\sin\alpha = \frac{\text{oposat}}{\text{hip.}}$, $\cos\alpha = \frac{\text{contigu}}{\text{hip.}}$, $\tan\alpha = \frac{\text{oposat}}{\text{contigu}}$.'
apartados:
  - id: a
    enunciado: Calcula les tres raons de $\alpha$ (amb quatre decimals).
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\sin\alpha', etiqueta: sinus, unidad: '', valor: 0.4706, tolerancia: 0.005 }
        - { simbolo: '\cos\alpha', etiqueta: cosinus, unidad: '', valor: 0.8824, tolerancia: 0.005, trampas: [{ valor: 0.4706, explicacion: 'Aquest és el sinus. El cosinus fa servir el catet contigu, el de 15 cm.' }] }
        - { simbolo: '\tan\alpha', etiqueta: tangent, unidad: '', valor: 0.5333, tolerancia: 0.005, trampas: [{ valor: 1.875, explicacion: 'L’has calculat al revés: la tangent és oposat entre contigu, $\frac{8}{15}$.' }] }
    pistas:
      - 'Primer la hipotenusa: $\sqrt{8^2 + 15^2}$.'
      - 'El catet oposat a $\alpha$ fa 8 cm i el contigu, 15 cm.'
    pasos:
      - titulo: Hipotenusa
        desarrollo: '$$c = \sqrt{8^2 + 15^2} = \sqrt{64 + 225} = \sqrt{289} = 17\un{cm}$$'
      - titulo: Les tres raons
        desarrollo: '$$\sin\alpha = \frac{8}{17} \approx 0{,}4706 \qquad \cos\alpha = \frac{15}{17} \approx 0{,}8824 \qquad \tan\alpha = \frac{8}{15} \approx 0{,}5333$$'
    resultado: '$\sin\alpha = \frac{8}{17}$, $\cos\alpha = \frac{15}{17}$, $\tan\alpha = \frac{8}{15}$.'
  - id: b
    enunciado: Calcula l’angle $\alpha$.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: '\alpha'
          etiqueta: angle
          unidad: '°'
          valor: 28.07
          trampas:
            - { valor: 61.93, explicacion: 'Aquest és l’altre angle agut, l’oposat al catet de 15 cm.' }
            - { valor: 0.49, explicacion: 'La calculadora està en radiants. Posa-la en graus (DEG).' }
    pistas:
      - 'Fes servir qualsevol de les raons amb la tecla inversa, per exemple $\tan^{-1}\frac{8}{15}$.'
    pasos:
      - titulo: Funció inversa
        desarrollo: '$$\alpha = \arctan\frac{8}{15} \approx 28{,}07^\circ$$'
        porque: 'Amb $\arcsin\frac{8}{17}$ o $\arccos\frac{15}{17}$ surt el mateix: és una bona comprovació.'
    resultado: '$\alpha \approx 28{,}07^\circ$.'
