titulo: Quants triangles hi ha?
tema: resolucion-triangulos
orden: 13
procedencia: original
dificultad: avanzado
habilidades: [conceptual, metodo]
resumen: Decidir sense resoldre si hi ha 0, 1 o 2 triangles en el cas CCA.
enunciado: |
  En els quatre casos es coneixen $A$, $b$ i $a$ (el costat oposat a $A$). L’altura des de $C$ és $h = b\sin A$.

  1. $A = 30^\circ$, $b = 10$, $a = 4$
  2. $A = 30^\circ$, $b = 10$, $a = 5$
  3. $A = 30^\circ$, $b = 10$, $a = 8$
  4. $A = 30^\circ$, $b = 10$, $a = 12$
apartados:
  - id: a
    enunciado: En quin dels casos hi ha **dos** triangles?
    respuesta:
      tipo: opciones
      opciones:
        - { texto: 'A l’1', explicacion: '$h = 10\sin 30^\circ = 5 > 4$: el costat $a$ no arriba a la base. No hi ha cap triangle ($\sin B = 1{,}25 > 1$).' }
        - { texto: 'Al 2', explicacion: '$a = h = 5$: un sol triangle, rectangle a $B$ ($\sin B = 1$).' }
        - { texto: 'Al 3', correcta: true, explicacion: '$h = 5 < a = 8 < b = 10$: la circumferència de radi 8 talla la base en dos punts. $\sin B = 0{,}625$ dona $B \approx 38{,}68^\circ$ o $141{,}32^\circ$, i tots dos hi caben amb $A = 30^\circ$.' }
        - { texto: 'Al 4', explicacion: '$a = 12 \ge b = 10$: el suplementari no hi cap ($30^\circ + 155{,}38^\circ > 180^\circ$). Un sol triangle.' }
    pistas:
      - 'Calcula $h = b\sin A$ i compara’l amb $a$ i amb $b$.'
    pasos:
      - titulo: Calcular l’altura
        desarrollo: '$h = 10\sin 30^\circ = 5$.'
      - titulo: Comparar
        desarrollo: '$a < h$: cap. $a = h$: un (rectangle). $h < a < b$: dos. $a \ge b$: un.'
    resultado: 'Només en el cas 3 ($a = 8$) hi ha dos triangles.'
