titulo: Dos triangles amb les mateixes dades
tema: resolucion-triangulos
orden: 9
procedencia: original
dificultad: avanzado
habilidades: [calculo, conceptual, multipaso]
resumen: El cas ambigu amb dues solucions. L’arcsinus dona un angle; el suplementari, un altre.
enunciado: |
  D’un triangle se sap que $a = 7$, $b = 10$ i $A = 30^\circ$.

  a) Quins valors pot tenir l’angle $B$?
  b) Per a cada solució, calcula el costat $c$.
figura:
  tipo: geometria
  titulo: Les dues posicions possibles de B
  puntos:
    - { id: A, x: 0, y: 0, lado: so }
    - { id: C, x: 8.660, y: 5, lado: n }
    - { id: B2, x: 3.761, y: 0, etiqueta: 'B₂', lado: s }
    - { id: B1, x: 13.559, y: 0, etiqueta: 'B₁', lado: s }
  segmentos:
    - { de: A, a: C, etiqueta: 'b = 10' }
    - { de: C, a: B2, etiqueta: '7', color: x, lado: derecha }
    - { de: C, a: B1, etiqueta: '7', color: x }
    - { de: A, a: B1, discontinuo: true }
  angulos:
    - { vertice: A, desde: B2, hasta: C, etiqueta: '30°', radio: 30 }
datos:
  - { simbolo: 'a', valor: '7', significado: 'oposat a A' }
  - { simbolo: 'b', valor: '10', significado: '' }
  - { simbolo: 'A', valor: '30^\circ', significado: 'angle NO comprès entre a i b' }
interpretacion: |
  És el cas **CCA**: l’angle conegut és davant d’un dels costats coneguts. Com que $b\sin A = 5 < a = 7 < b = 10$, la circumferència de centre $C$ i radi 7 talla la base en **dos punts**: hi ha dos triangles.
apartados:
  - id: a
    enunciado: Escriu tots els valors possibles de $B$.
    respuesta:
      tipo: conjunto
      simbolo: 'B'
      intervalo: '(0^\circ,\ 150^\circ)'
      valores: [45.58, 134.42]
      trampas:
        - { valores: [45.58], explicacion: 'És l’angle que dona la calculadora, però el suplementari, $180^\circ - 45{,}58^\circ = 134{,}42^\circ$, té el mateix sinus. Comprova si hi cap amb $A = 30^\circ$: $30^\circ + 134{,}42^\circ < 180^\circ$, així que sí.' }
    pistas:
      - 'Teorema del sinus: $\sin B = \dfrac{b\sin A}{a}$.'
      - 'Dos angles entre $0^\circ$ i $180^\circ$ tenen aquest sinus. Hi caben tots dos en un triangle amb $A = 30^\circ$?'
    pasos:
      - titulo: Teorema del sinus
        desarrollo: '$$\sin B = \frac{10\sin 30^\circ}{7} = \frac{5}{7} \approx 0{,}7143$$'
      - titulo: Els dos angles
        desarrollo: '$$B_1 = \arcsin\frac57 \approx 45{,}58^\circ \qquad B_2 = 180^\circ - 45{,}58^\circ \approx 134{,}42^\circ$$'
        porque: 'Tots dos són possibles perquè $30^\circ + 134{,}42^\circ = 164{,}42^\circ < 180^\circ$.'
    resultado: '$B \approx 45{,}58^\circ$ o $B \approx 134{,}42^\circ$.'
  - id: b
    enunciado: Costat $c$ a cada triangle (primer el que correspon a $B_1 \approx 45{,}58^\circ$).
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'c_1', etiqueta: 'amb B ≈ 45,58°', unidad: '', valor: 13.56 }
        - { simbolo: 'c_2', etiqueta: 'amb B ≈ 134,42°', unidad: '', valor: 3.76 }
    pistas:
      - 'Primer $C = 180^\circ - A - B$ a cada cas.'
    pasos:
      - titulo: Tercer angle a cada cas
        desarrollo: '$$C_1 = 180^\circ - 30^\circ - 45{,}58^\circ = 104{,}42^\circ \qquad C_2 = 180^\circ - 30^\circ - 134{,}42^\circ = 15{,}58^\circ$$'
      - titulo: Teorema del sinus
        desarrollo: '$$c_1 = \frac{7\sin 104{,}42^\circ}{\sin 30^\circ} \approx 13{,}56 \qquad c_2 = \frac{7\sin 15{,}58^\circ}{\sin 30^\circ} \approx 3{,}76$$'
    resultado: 'Triangle 1: $B \approx 45{,}58^\circ$, $C \approx 104{,}42^\circ$, $c \approx 13{,}56$. Triangle 2: $B \approx 134{,}42^\circ$, $C \approx 15{,}58^\circ$, $c \approx 3{,}76$.'
errores:
  - error: 'Quedar-se només amb l’angle de la calculadora'
    explicacion: 'L’arcsinus sempre dona un angle agut. En el cas CCA cal provar també el suplementari.'
laboratorio: { a: 7, b: 10, c: 3.761 }
