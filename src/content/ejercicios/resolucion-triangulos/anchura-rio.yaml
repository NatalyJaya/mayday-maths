titulo: L’amplada d’un riu
tema: resolucion-triangulos
orden: 10
procedencia: original
dificultad: intermedio
habilidades: [planteamiento, modelizacion, multipaso]
resumen: Teorema del sinus per a una distància i sinus per a l’amplada.
enunciado: |
  Per mesurar l’amplada d’un riu es marquen dos punts $A$ i $B$ en una riba, separats $60\un{m}$. Un arbre $T$ de l’altra riba es veu des d’$A$ amb un angle $\widehat{TAB} = 50^\circ$ i des de $B$ amb un angle $\widehat{TBA} = 70^\circ$. Quina és l’amplada del riu (la distància de $T$ a la riba $AB$)?
figura:
  tipo: geometria
  puntos:
    - { id: A, x: 0, y: 0, lado: s }
    - { id: B, x: 60, y: 0, lado: s }
    - { id: T, x: 41.85, y: 49.87, lado: n }
    - { id: H, x: 41.85, y: 0, etiqueta: '', marca: false }
  segmentos:
    - { de: A, a: B, etiqueta: '60 m', lado: derecha }
    - { de: A, a: T }
    - { de: B, a: T }
    - { de: T, a: H, etiqueta: 'amplada = ?', color: g, discontinuo: true }
  angulos:
    - { vertice: A, desde: B, hasta: T, etiqueta: '50°', radio: 30 }
    - { vertice: B, desde: T, hasta: A, etiqueta: '70°', radio: 26 }
    - { vertice: H, desde: B, hasta: T, recto: true }
  textos:
    - { x: 20, y: 56, texto: 'altra riba' }
apartados:
  - id: a
    enunciado: Calcula la distància $AT$ i l’amplada del riu.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'AT', etiqueta: distància d’A a l’arbre, unidad: m, valor: 65.10 }
        - simbolo: 'h'
          etiqueta: amplada del riu
          unidad: m
          valor: 49.87
          trampas:
            - { valor: 65.10, explicacion: 'Aquesta és la distància $AT$, que va en diagonal. L’amplada és la distància **perpendicular** a la riba.' }
    pistas:
      - 'L’angle a $T$ és $180^\circ - 50^\circ - 70^\circ = 60^\circ$, i és davant del costat de 60 m.'
      - 'Amb el teorema del sinus, $AT = \dfrac{60\sin 70^\circ}{\sin 60^\circ}$.'
      - 'L’amplada és el catet oposat a $50^\circ$ en el triangle rectangle d’hipotenusa $AT$.'
    pasos:
      - titulo: Angle a T
        desarrollo: '$$T = 180^\circ - 50^\circ - 70^\circ = 60^\circ$$'
      - titulo: Teorema del sinus
        desarrollo: '$$\frac{AT}{\sin 70^\circ} = \frac{60}{\sin 60^\circ} \;\Rightarrow\; AT \approx 65{,}10\un{m}$$'
        porque: '$AT$ és oposat a l’angle a $B$ ($70^\circ$) i els 60 m, a l’angle a $T$ ($60^\circ$).'
      - titulo: Amplada
        desarrollo: '$$h = AT\cdot\sin 50^\circ \approx 65{,}10\cdot 0{,}7660 \approx 49{,}87\un{m}$$'
        porque: 'Al triangle rectangle $ATH$, l’amplada és el catet oposat a l’angle de $50^\circ$.'
    resultado: 'El riu fa uns $49{,}9\un{m}$ d’amplada.'
