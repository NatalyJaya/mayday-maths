titulo: L’àrea d’una parcel·la triangular
tema: resolucion-triangulos
orden: 7
procedencia: original
dificultad: intermedio
habilidades: [modelizacion, calculo]
resumen: Àrea amb dos costats i l’angle comprès, i la tanca del tercer costat.
enunciado: |
  Una parcel·la triangular té dos costats de $40\un{m}$ i $55\un{m}$ que formen un angle de $72^\circ$.

  a) Quina àrea té?
  b) Quants metres de tanca calen per al tercer costat?
figura:
  tipo: triangulo
  a: 57.143
  b: 40
  c: 55
  etiquetas: { b: '40 m', c: '55 m', A: '72°', a: '?' }
  colores: { a: g }
apartados:
  - id: a
    enunciado: Àrea de la parcel·la.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'S'
          etiqueta: àrea
          unidad: m²
          valor: 1046.16
          trampas:
            - { valor: 1100, explicacion: 'Això seria si l’angle fos recte ($\frac12\cdot 40\cdot 55$). Falta multiplicar per $\sin 72^\circ$.' }
            - { valor: 2092.32, explicacion: 'Et falta el $\frac12$ de la fórmula de l’àrea.' }
    pasos:
      - titulo: Fórmula de l’àrea
        desarrollo: '$$S = \frac12\cdot 40\cdot 55\cdot\sin 72^\circ \approx 1046{,}16\un{m^2}$$'
        porque: '$40\sin 72^\circ$ és l’altura sobre el costat de $55\un{m}$.'
    resultado: '$S \approx 1046{,}2\un{m^2}$.'
  - id: b
    enunciado: Longitud del tercer costat.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'a', etiqueta: tercer costat, unidad: m, valor: 57.14 }
    pasos:
      - titulo: Teorema del cosinus
        desarrollo: '$$a = \sqrt{40^2 + 55^2 - 2\cdot 40\cdot 55\cos 72^\circ} \approx 57{,}14\un{m}$$'
    resultado: 'Calen uns $57{,}1\un{m}$ de tanca.'
