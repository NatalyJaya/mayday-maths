titulo: Dos costats i l’angle que formen
tema: resolucion-triangulos
orden: 5
procedencia: original
dificultad: basico
habilidades: [calculo, metodo]
resumen: Teorema del cosinus amb un resultat exacte.
enunciado: En un triangle, $b = 8$, $c = 5$ i $A = 60^\circ$. Calcula el costat $a$.
figura:
  tipo: triangulo
  a: 7
  b: 8
  c: 5
  etiquetas: { b: '8', c: '5', a: 'a = ?', A: '60°' }
  colores: { a: g }
apartados:
  - id: a
    enunciado: Calcula $a$.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'a'
          etiqueta: costat
          unidad: ''
          valor: 7
          trampas:
            - { valor: 9.43, explicacion: 'Has fet servir Pitàgores: $\sqrt{8^2 + 5^2}$. L’angle és de $60^\circ$, no de $90^\circ$.' }
            - { valor: 11.36, explicacion: 'El terme és $-2bc\cos A$, amb signe menys. L’has sumat.' }
    pistas:
      - 'L’angle conegut és entre els dos costats?'
      - '$\cos 60^\circ = \frac12$.'
    pasos:
      - titulo: Teorema del cosinus
        desarrollo: '$$a^2 = 8^2 + 5^2 - 2\cdot 8\cdot 5\cdot\cos 60^\circ = 64 + 25 - 40 = 49 \;\Rightarrow\; a = 7$$'
        porque: 'L’angle $A$ és entre els costats $b$ i $c$ (cas CAC).'
    resultado: '$a = 7$.'
