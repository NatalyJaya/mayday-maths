titulo: L’altura d’una muntanya
tema: resolucion-triangulos
orden: 11
procedencia: original
dificultad: avanzado
habilidades: [planteamiento, calculo, multipaso]
resumen: Doble observació amb angles que no són notables.
enunciado: |
  Des d’un punt d’una plana es veu el cim d’una muntanya amb un angle d’elevació de $25^\circ$. Després d’avançar $800\un{m}$ cap a la muntanya, l’angle és de $38^\circ$. Quina altura té la muntanya sobre la plana?
figura:
  tipo: geometria
  puntos:
    - { id: A, x: 0, y: 0, lado: s }
    - { id: B, x: 800, y: 0, lado: s }
    - { id: P, x: 1984.36, y: 0, etiqueta: '', marca: false }
    - { id: T, x: 1984.36, y: 925.32, etiqueta: 'cim', lado: n }
  segmentos:
    - { de: A, a: B, etiqueta: '800 m', color: x, lado: derecha }
    - { de: B, a: P, etiqueta: 'x', color: x, lado: derecha }
    - { de: P, a: T, etiqueta: 'h = ?', color: y, lado: derecha }
    - { de: A, a: T, discontinuo: true }
    - { de: B, a: T, discontinuo: true }
  angulos:
    - { vertice: A, desde: P, hasta: T, etiqueta: '25°', color: g, radio: 50 }
    - { vertice: B, desde: P, hasta: T, etiqueta: '38°', color: g, radio: 36 }
    - { vertice: P, desde: B, hasta: T, recto: true }
  suelo: { y: 0, desde: -50, hasta: 2050 }
apartados:
  - id: a
    enunciado: Altura de la muntanya.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'h'
          etiqueta: altura
          unidad: m
          valor: 925.32
          trampas:
            - { valor: 373.05, explicacion: 'Has fet servir $800\tan 25^\circ$, com si els 800 m fossin la distància fins al peu. Són la distància entre les dues observacions.' }
    pistas:
      - 'Anomena $x$ la distància des del segon punt fins a la vertical del cim.'
      - '$h = x\tan 38^\circ$ i $h = (x + 800)\tan 25^\circ$.'
    pasos:
      - titulo: Dues equacions
        desarrollo: '$$h = x\tan 38^\circ \qquad h = (x + 800)\tan 25^\circ$$'
      - titulo: Resoldre
        desarrollo: '$$x = \frac{800\tan 25^\circ}{\tan 38^\circ - \tan 25^\circ} \approx \frac{373{,}05}{0{,}31498} \approx 1184{,}36\un{m}$$'
      - titulo: Altura
        desarrollo: '$$h = 1184{,}36\cdot\tan 38^\circ \approx 925{,}32\un{m}$$'
        porque: 'Comprovació: $(1184{,}36 + 800)\tan 25^\circ \approx 925{,}3$ ✔.'
    resultado: 'La muntanya fa uns $925\un{m}$ sobre la plana.'
errores:
  - error: 'Arrodonir massa les tangents'
    explicacion: 'A $\tan 38^\circ - \tan 25^\circ$ es resten dos nombres semblants: si s’arrodoneixen a dos decimals, l’error es nota molt. Treballa amb quatre decimals o desa els valors a la memòria de la calculadora.'
