titulo: La altura de una montaña
tema: resolucion-triangulos
orden: 11
procedencia: original
dificultad: avanzado
habilidades: [planteamiento, calculo, multipaso]
resumen: Doble observación con ángulos que no son notables.
enunciado: |
  Desde un punto de una llanura se ve la cima de una montaña con un ángulo de elevación de $25^\circ$. Después de avanzar $800\un{m}$ hacia la montaña, el ángulo es de $38^\circ$. ¿Qué altura tiene la montaña sobre la llanura?
figura:
  tipo: geometria
  puntos:
    - { id: A, x: 0, y: 0, lado: s }
    - { id: B, x: 800, y: 0, lado: s }
    - { id: P, x: 1984.36, y: 0, etiqueta: '', marca: false }
    - { id: T, x: 1984.36, y: 925.32, etiqueta: 'cima', lado: n }
  segmentos:
    - { de: A, a: B, etiqueta: '800 m', color: x, lado: derecha }
    - { de: B, a: P, etiqueta: 'x', color: x, lado: derecha }
    - { de: P, a: T, etiqueta: 'h = ?', color: y, lado: derecha }
    - { de: A, a: T, discontinuo: true }
    - { de: B, a: T, discontinuo: true }
  angulos:
    - { vertice: A, desde: P, hasta: T, etiqueta: '25°', color: g, radio: 50 }
    - { vertice: B, desde: P, hasta: T, etiqueta: '38°', color: g, radio: 36 }
    - { vertice: P, desde: B, hasta: T, recto: true }
  suelo: { y: 0, desde: -50, hasta: 2050 }
apartados:
  - id: a
    enunciado: Altura de la montaña.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'h'
          etiqueta: altura
          unidad: m
          valor: 925.32
          trampas:
            - { valor: 373.05, explicacion: 'Has usado $800\tan 25^\circ$, como si los 800 m fueran la distancia hasta el pie. Son la distancia entre las dos observaciones.' }
    pistas:
      - 'Llama $x$ a la distancia desde el segundo punto hasta la vertical de la cima.'
      - '$h = x\tan 38^\circ$ y $h = (x + 800)\tan 25^\circ$.'
    pasos:
      - titulo: Dos ecuaciones
        desarrollo: '$$h = x\tan 38^\circ \qquad h = (x + 800)\tan 25^\circ$$'
      - titulo: Resolver
        desarrollo: '$$x = \frac{800\tan 25^\circ}{\tan 38^\circ - \tan 25^\circ} \approx \frac{373{,}05}{0{,}31498} \approx 1184{,}36\un{m}$$'
      - titulo: Altura
        desarrollo: '$$h = 1184{,}36\cdot\tan 38^\circ \approx 925{,}32\un{m}$$'
        porque: 'Comprobación: $(1184{,}36 + 800)\tan 25^\circ \approx 925{,}3$ ✔.'
    resultado: 'La montaña mide unos $925\un{m}$ sobre la llanura.'
errores:
  - error: 'Redondear mucho las tangentes'
    explicacion: 'En $\tan 38^\circ - \tan 25^\circ$ se restan dos números parecidos: si se redondean a dos decimales, el error se nota mucho. Trabaja con cuatro decimales o guarda los valores en la memoria de la calculadora.'
