titulo: La altura de una torre inaccesible
tema: resolucion-triangulos
rol: ejemplo
orden: 1
procedencia: original
dificultad: intermedio
habilidades: [planteamiento, calculo, multipaso]
resumen: Dos ángulos de elevación desde dos puntos alineados con la torre.
enunciado: |
  Desde un punto $A$ se ve lo alto de una torre con un ángulo de elevación de $30^\circ$. Al acercarnos $50\un{m}$ en línea recta hacia la torre, hasta $B$, el ángulo de elevación es de $45^\circ$. ¿Cuánto mide la torre? (Desprecia la altura del observador.)
figura:
  tipo: geometria
  puntos:
    - { id: A, x: 0, y: 0, lado: s }
    - { id: B, x: 50, y: 0, lado: s }
    - { id: P, x: 118.3, y: 0, etiqueta: '', marca: false }
    - { id: T, x: 118.3, y: 68.3, lado: n }
  segmentos:
    - { de: A, a: B, etiqueta: '50 m', color: x, lado: derecha }
    - { de: B, a: P, etiqueta: 'x', color: x, lado: derecha }
    - { de: P, a: T, etiqueta: 'h', color: y, lado: derecha }
    - { de: A, a: T, discontinuo: true }
    - { de: B, a: T, discontinuo: true }
  angulos:
    - { vertice: A, desde: P, hasta: T, etiqueta: '30°', color: g, radio: 40 }
    - { vertice: B, desde: P, hasta: T, etiqueta: '45°', color: g, radio: 30 }
    - { vertice: P, desde: B, hasta: T, recto: true }
  suelo: { y: 0, desde: -5, hasta: 125 }
datos:
  - { simbolo: 'd', valor: '50\un{m}', significado: 'distancia entre A y B' }
  - { simbolo: '\alpha', valor: '30^\circ', significado: 'elevación desde A (lejos)' }
  - { simbolo: '\beta', valor: '45^\circ', significado: 'elevación desde B (cerca)' }
incognitas:
  - 'La altura $h$ (y, de paso, la distancia $x$ de $B$ al pie).'
interpretacion: |
  Hay dos triángulos rectángulos con la misma altura $h$: el grande ($ATP$, con $30^\circ$) y el pequeño ($BTP$, con $45^\circ$). Ninguno se puede resolver solo, porque en cada uno solo conocemos el ángulo. Juntos dan **un sistema de dos ecuaciones** con dos incógnitas.
apartados:
  - id: a
    enunciado: Calcula la altura de la torre.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'h', etiqueta: altura de la torre, unidad: m, valor: 68.30 }
    pasos:
      - titulo: Una ecuación por triángulo
        piensa: 'En cada triángulo rectángulo conoces un ángulo. ¿Qué razón une la altura con la distancia horizontal?'
        desarrollo: |
          $$\text{Pequeño: } \tan 45^\circ = \frac{h}{x} \qquad\qquad \text{Grande: } \tan 30^\circ = \frac{h}{x + 50}$$
        porque: 'La tangente relaciona los dos catetos: la altura y la distancia horizontal.'
      - titulo: Despejar h e igualar
        desarrollo: |
          $$h = x\tan 45^\circ = x \qquad h = (x + 50)\tan 30^\circ$$
          $$x = (x + 50)\cdot\frac{\sqrt3}{3}$$
      - titulo: Resolver
        desarrollo: |
          $$3x = \sqrt3\,x + 50\sqrt3 \;\Rightarrow\; x(3 - \sqrt3) = 50\sqrt3 \;\Rightarrow\; x = \frac{50\sqrt3}{3 - \sqrt3} \approx 68{,}30\un{m}$$
      - titulo: La altura
        desarrollo: '$$h = x\tan 45^\circ = x \approx 68{,}30\un{m}$$'
        porque: 'Comprobación: desde $A$, $\tan 30^\circ \approx \frac{68{,}30}{118{,}30} \approx 0{,}577$ ✔.'
    resultado: 'La torre mide unos $68{,}3\un{m}$.'
errores:
  - error: 'Usar 50 m como distancia hasta la torre'
    explicacion: 'Los 50 m son lo que se avanza entre las dos observaciones. La distancia hasta el pie de la torre es desconocida.'
alternativas:
  - titulo: Con el teorema del seno
    desarrollo: 'En el triángulo $ABT$: el ángulo en $B$ es $180^\circ - 45^\circ = 135^\circ$ y el ángulo en $T$ es $180^\circ - 30^\circ - 135^\circ = 15^\circ$. Por el teorema del seno, $BT = \frac{50\sin 30^\circ}{\sin 15^\circ} \approx 96{,}59\un{m}$, y $h = BT\sin 45^\circ \approx 68{,}30\un{m}$.'
laboratorio: { a: 96.59, b: 136.6, c: 50 }
