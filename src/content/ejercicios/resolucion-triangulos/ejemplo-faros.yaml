titulo: Un vaixell vist des de dos fars
tema: resolucion-triangulos
rol: ejemplo
orden: 2
procedencia: original
dificultad: intermedio
habilidades: [planteamiento, metodo, modelizacion]
resumen: Un costat i els dos angles contigus. Tercer angle i teorema del sinus.
enunciado: |
  Dos fars $A$ i $B$ són a la costa, separats $10\un{km}$. Des d’$A$, la direcció d’un vaixell $S$ forma un angle de $52^\circ$ amb la línia $AB$; des de $B$, forma un angle de $71^\circ$. A quina distància és el vaixell de cada far?
figura:
  tipo: triangulo
  a: 9.396
  b: 11.274
  c: 10
  nombres: { A: A, B: B, C: S }
  etiquetas: { c: '10 km', a: 'BS = ?', b: 'AS = ?', A: '52°', B: '71°' }
  colores: { a: g, b: g }
datos:
  - { simbolo: 'c = AB', valor: '10\un{km}', significado: 'distància entre els fars' }
  - { simbolo: 'A', valor: '52^\circ', significado: 'angle al far A' }
  - { simbolo: 'B', valor: '71^\circ', significado: 'angle al far B' }
incognitas:
  - 'Les distàncies $AS$ i $BS$.'
apartados:
  - id: a
    enunciado: Calcula les distàncies del vaixell a cada far.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'AS', etiqueta: distància al far A, unidad: km, valor: 11.27 }
        - { simbolo: 'BS', etiqueta: distància al far B, unidad: km, valor: 9.40 }
    pasos:
      - titulo: El tercer angle
        piensa: 'Hi ha alguna parella costat–angle oposat completa?'
        desarrollo: '$$S = 180^\circ - 52^\circ - 71^\circ = 57^\circ$$'
        porque: 'El costat conegut, $AB$, és davant de l’angle $S$. Amb $S$ ja tenim una parella completa: costat $10\un{km}$ i angle $57^\circ$.'
      - titulo: Triar el teorema
        desarrollo: 'Tenim la parella ($c$, $S$) i els altres dos angles: **teorema del sinus**.'
      - titulo: Distància al far A
        desarrollo: '$$\frac{AS}{\sin 71^\circ} = \frac{10}{\sin 57^\circ} \;\Rightarrow\; AS = \frac{10\sin 71^\circ}{\sin 57^\circ} \approx 11{,}27\un{km}$$'
        porque: '$AS$ és el costat oposat a l’angle a $B$ ($71^\circ$).'
      - titulo: Distància al far B
        desarrollo: '$$BS = \frac{10\sin 52^\circ}{\sin 57^\circ} \approx 9{,}40\un{km}$$'
        porque: 'Comprovació: el costat més gran ($AS$) és davant de l’angle més gran ($71^\circ$) ✔.'
    resultado: 'El vaixell és a uns $11{,}27\un{km}$ del far $A$ i a uns $9{,}40\un{km}$ del far $B$.'
errores:
  - error: 'Aparellar cada costat amb un angle contigu'
    explicacion: 'En el teorema del sinus, cada costat va amb el seu angle **oposat**. $AS$ va amb l’angle a $B$, no amb el d’$A$.'
laboratorio: { a: 9.396, b: 11.274, c: 10 }
