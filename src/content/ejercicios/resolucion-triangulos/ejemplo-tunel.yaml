titulo: La longitud d’un túnel
tema: resolucion-triangulos
rol: ejemplo
orden: 3
procedencia: original
dificultad: intermedio
habilidades: [metodo, modelizacion, calculo]
resumen: Dos costats i l’angle comprès. Teorema del cosinus i un angle amb l’arccosinus.
enunciado: |
  Cal excavar un túnel recte entre dos punts $A$ i $B$ d’una muntanya. Des d’un punt $C$, a la vall, es mesura $CA = 380\un{m}$, $CB = 450\un{m}$ i l’angle $\widehat{ACB} = 68^\circ$.

  a) Quant farà el túnel?
  b) Quin angle forma el túnel amb la direcció $AC$ al punt $A$?
figura:
  tipo: triangulo
  a: 450
  b: 380
  c: 467.74
  etiquetas: { a: '450 m', b: '380 m', c: 'túnel = ?', C: '68°', A: '?' }
  colores: { c: g }
datos:
  - { simbolo: 'b = CA', valor: '380\un{m}', significado: '' }
  - { simbolo: 'a = CB', valor: '450\un{m}', significado: '' }
  - { simbolo: 'C', valor: '68^\circ', significado: 'angle entre els dos costats coneguts' }
apartados:
  - id: a
    enunciado: Longitud del túnel.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'c'
          etiqueta: longitud del túnel
          unidad: m
          valor: 467.74
          trampas:
            - { valor: 588.98, explicacion: 'Has fet servir Pitàgores. L’angle a $C$ és de $68^\circ$, no de $90^\circ$: hi falta el terme $-2ab\cos C$.' }
    pasos:
      - titulo: Triar el teorema
        piensa: 'L’angle conegut, és entre els dos costats coneguts o davant d’un d’ells?'
        desarrollo: 'És **entre** ells (cas CAC). No hi ha cap parella costat–angle oposat: **teorema del cosinus**.'
      - titulo: Teorema del cosinus
        desarrollo: '$$c^2 = 380^2 + 450^2 - 2\cdot 380\cdot 450\cdot\cos 68^\circ \approx 144\,400 + 202\,500 - 128\,116 \approx 218\,784$$'
      - titulo: Arrel
        desarrollo: '$$c \approx \sqrt{218\,784} \approx 467{,}74\un{m}$$'
    resultado: 'El túnel farà uns $467{,}7\un{m}$.'
  - id: b
    enunciado: Angle a $A$.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'A', etiqueta: angle a A, unidad: '°', valor: 63.12 }
    pasos:
      - titulo: Teorema del cosinus aïllant l’angle
        piensa: 'Ja coneixes els tres costats. Quin mètode no té cas ambigu?'
        desarrollo: '$$\cos A = \frac{b^2 + c^2 - a^2}{2bc} = \frac{380^2 + 467{,}74^2 - 450^2}{2\cdot 380\cdot 467{,}74} \approx 0{,}4522 \;\Rightarrow\; A \approx 63{,}12^\circ$$'
        porque: 'Amb el cosinus no hi ha ambigüitat: cada cosinus correspon a un únic angle entre $0^\circ$ i $180^\circ$. Amb el teorema del sinus també surt, però caldria comprovar el suplementari.'
    resultado: 'El túnel forma uns $63{,}1^\circ$ amb la direcció $AC$.'
laboratorio: { a: 450, b: 380, c: 467.74 }
