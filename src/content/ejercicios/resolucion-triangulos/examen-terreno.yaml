titulo: Un terreno de cuatro lados
tema: resolucion-triangulos
orden: 15
procedencia: original
dificultad: examen
habilidades: [geometria, multipaso, metodo, modelizacion]
resumen: Dividir un cuadrilátero con una diagonal y resolver dos triángulos encadenados.
enunciado: |
  Un terreno tiene forma de cuadrilátero $ABCD$. Se ha medido: $AB = 50\un{m}$, $BC = 40\un{m}$, el ángulo $\widehat{B} = 110^\circ$, $AD = 45\un{m}$ y el ángulo $\widehat{CAD} = 35^\circ$ (entre la diagonal $AC$ y el lado $AD$).

  a) Calcula la diagonal $AC$.
  b) Calcula el área del terreno.
  c) Calcula el lado $CD$.
figura:
  tipo: geometria
  puntos:
    - { id: A, x: 0, y: 0, lado: so }
    - { id: B, x: 50, y: 0, lado: se }
    - { id: C, x: 63.68, y: 37.59, lado: ne }
    - { id: D, x: 18.62, y: 40.96, lado: no }
  segmentos:
    - { de: A, a: B, etiqueta: '50 m', lado: derecha }
    - { de: B, a: C, etiqueta: '40 m', lado: derecha }
    - { de: C, a: D, etiqueta: '?', color: g, lado: derecha }
    - { de: D, a: A, etiqueta: '45 m', lado: derecha }
    - { de: A, a: C, etiqueta: 'diagonal', discontinuo: true, color: x }
  angulos:
    - { vertice: B, desde: C, hasta: A, etiqueta: '110°', radio: 18 }
    - { vertice: A, desde: C, hasta: D, etiqueta: '35°', radio: 34 }
interpretacion: |
  Un cuadrilátero no se resuelve directamente. La diagonal $AC$ lo divide en dos triángulos: el $ABC$ (dos lados y el ángulo que forman) y el $ACD$, que se puede resolver en cuanto se conozca $AC$.
apartados:
  - id: a
    enunciado: Diagonal $AC$.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'AC', etiqueta: diagonal, unidad: m, valor: 73.95 }
    pasos:
      - titulo: Teorema del coseno en ABC
        desarrollo: '$$AC^2 = 50^2 + 40^2 - 2\cdot 50\cdot 40\cos 110^\circ \approx 4100 + 1368{,}08 = 5468{,}08 \;\Rightarrow\; AC \approx 73{,}95\un{m}$$'
        porque: '$\cos 110^\circ < 0$, así que el término $-2\cdot50\cdot40\cos 110^\circ$ suma: el ángulo es obtuso.'
    resultado: '$AC \approx 73{,}95\un{m}$.'
  - id: b
    enunciado: Área del terreno.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'S'
          etiqueta: área total
          unidad: m²
          valor: 1894.0
          trampas:
            - { valor: 939.69, explicacion: 'Esa es solo el área del triángulo $ABC$. Falta sumar la del $ACD$.' }
            - { valor: 954.31, explicacion: 'Esa es solo el área del triángulo $ACD$. Falta sumar la del $ABC$.' }
    pistas:
      - 'Suma las áreas de los dos triángulos, cada una con $\frac12\cdot\text{lado}\cdot\text{lado}\cdot\sin(\text{ángulo comprendido})$.'
    pasos:
      - titulo: Área de ABC
        desarrollo: '$$S_1 = \frac12\cdot 50\cdot 40\sin 110^\circ \approx 939{,}69\un{m^2}$$'
      - titulo: Área de ACD
        desarrollo: '$$S_2 = \frac12\cdot 73{,}95\cdot 45\sin 35^\circ \approx 954{,}31\un{m^2}$$'
        porque: 'El ángulo de $35^\circ$ está entre $AC$ y $AD$.'
      - titulo: Total
        desarrollo: '$$S = S_1 + S_2 \approx 1894{,}0\un{m^2}$$'
    resultado: 'El terreno mide unos $1894\un{m^2}$.'
  - id: c
    enunciado: Lado $CD$.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'CD', etiqueta: lado, unidad: m, valor: 45.18 }
    pasos:
      - titulo: Teorema del coseno en ACD
        desarrollo: '$$CD^2 = 73{,}95^2 + 45^2 - 2\cdot 73{,}95\cdot 45\cos 35^\circ \Rightarrow CD \approx 45{,}18\un{m}$$'
    resultado: '$CD \approx 45{,}2\un{m}$.'
errores:
  - error: 'Redondear la diagonal a unidades antes de seguir'
    explicacion: 'Los resultados de un apartado se usan en el siguiente: arrastra al menos dos decimales.'
