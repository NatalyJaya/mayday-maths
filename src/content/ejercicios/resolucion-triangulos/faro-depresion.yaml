titulo: Un vaixell vist des d’un far
tema: resolucion-triangulos
orden: 3
procedencia: original
dificultad: basico
habilidades: [planteamiento, modelizacion]
resumen: Angle de depressió i tangent.
enunciado: |
  Des de dalt d’un far de $45\un{m}$ d’altura sobre el nivell del mar es veu un vaixell amb un angle de depressió de $12^\circ$. A quina distància horitzontal del far és el vaixell?
figura:
  tipo: geometria
  puntos:
    - { id: F, x: 0, y: 45, etiqueta: 'far', lado: n }
    - { id: O, x: 0, y: 0, etiqueta: '', marca: false }
    - { id: S, x: 211.7, y: 0, etiqueta: 'vaixell', lado: s }
    - { id: R, x: 211.7, y: 45, etiqueta: '', marca: false }
  segmentos:
    - { de: O, a: F, etiqueta: '45 m', color: y }
    - { de: O, a: S, etiqueta: 'd = ?', color: x, lado: derecha }
    - { de: F, a: S, color: g }
    - { de: F, a: R, discontinuo: true }
  angulos:
    - { vertice: F, desde: R, hasta: S, etiqueta: '12°', color: g, radio: 60 }
    - { vertice: O, desde: S, hasta: F, recto: true }
  suelo: { y: 0, desde: -10, hasta: 225 }
apartados:
  - id: a
    enunciado: Distància horitzontal del far al vaixell.
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'd'
          etiqueta: distància
          unidad: m
          valor: 211.71
          trampas:
            - { valor: 9.57, explicacion: 'Has posat l’angle de $12^\circ$ a dalt del triangle, al far. L’angle de depressió es mesura des de l’horitzontal: al triangle apareix al vaixell, com a angle d’elevació.' }
            - { valor: 216.44, explicacion: 'Aquesta és la distància en línia recta des de dalt del far (la hipotenusa). Es demana la distància horitzontal.' }
    pistas:
      - 'L’angle de depressió des del far és igual a l’angle d’elevació des del vaixell.'
      - 'Al vaixell: catet oposat 45 m, contigu $d$.'
    pasos:
      - titulo: Situar l’angle
        desarrollo: 'L’angle de depressió des del far ($12^\circ$) és igual al d’elevació des del vaixell (alterns entre horitzontals).'
      - titulo: Tangent
        desarrollo: '$$\tan 12^\circ = \frac{45}{d} \;\Rightarrow\; d = \frac{45}{\tan 12^\circ} \approx 211{,}71\un{m}$$'
    resultado: 'El vaixell és a uns $211{,}7\un{m}$ del far.'
