titulo: Les diagonals d’un paral·lelogram
tema: resolucion-triangulos
orden: 12
procedencia: original
dificultad: avanzado
habilidades: [geometria, metodo, multipaso]
resumen: Cada diagonal és el tercer costat d’un triangle. Els dos angles són suplementaris.
enunciado: |
  Un paral·lelogram té costats de $6\un{cm}$ i $9\un{cm}$, i un dels seus angles mesura $50^\circ$. Calcula la longitud de les seves dues diagonals.
figura:
  tipo: geometria
  puntos:
    - { id: A, x: 0, y: 0, lado: so }
    - { id: B, x: 9, y: 0, lado: se }
    - { id: D, x: 3.857, y: 4.596, lado: no }
    - { id: C, x: 12.857, y: 4.596, lado: ne }
  segmentos:
    - { de: A, a: B, etiqueta: '9 cm', lado: derecha }
    - { de: A, a: D, etiqueta: '6 cm' }
    - { de: D, a: C }
    - { de: B, a: C }
    - { de: B, a: D, etiqueta: 'd₁', color: x, discontinuo: true }
    - { de: A, a: C, etiqueta: 'd₂', color: g, discontinuo: true, lado: derecha }
  angulos:
    - { vertice: A, desde: B, hasta: D, etiqueta: '50°', radio: 26 }
    - { vertice: B, desde: C, hasta: A, etiqueta: '130°', radio: 22 }
apartados:
  - id: a
    enunciado: Diagonal curta $d_1$ i diagonal llarga $d_2$.
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'd_1', etiqueta: diagonal curta, unidad: cm, valor: 6.90 }
        - { simbolo: 'd_2', etiqueta: diagonal llarga, unidad: cm, valor: 13.65 }
    pistas:
      - 'La diagonal $BD$ és el tercer costat del triangle $ABD$, amb l’angle de $50^\circ$ entre els costats de 6 i 9.'
      - 'Els angles consecutius d’un paral·lelogram són suplementaris: l’altre angle fa $130^\circ$.'
    pasos:
      - titulo: Diagonal curta (angle de 50°)
        desarrollo: '$$d_1^2 = 6^2 + 9^2 - 2\cdot 6\cdot 9\cos 50^\circ \approx 117 - 69{,}42 = 47{,}58 \;\Rightarrow\; d_1 \approx 6{,}90\un{cm}$$'
      - titulo: Diagonal llarga (angle de 130°)
        desarrollo: '$$d_2^2 = 6^2 + 9^2 - 2\cdot 6\cdot 9\cos 130^\circ \approx 117 + 69{,}42 = 186{,}42 \;\Rightarrow\; d_2 \approx 13{,}65\un{cm}$$'
        porque: '$\cos 130^\circ = -\cos 50^\circ$: el terme canvia de signe i la diagonal oposada a l’angle obtús és més llarga.'
    resultado: '$d_1 \approx 6{,}90\un{cm}$ i $d_2 \approx 13{,}65\un{cm}$.'
alternativas:
  - titulo: Una comprovació elegant
    desarrollo: 'Sumant les dues equacions, els cosinus es cancel·len: $d_1^2 + d_2^2 = 2(6^2 + 9^2) = 234$. Amb els valors obtinguts: $47{,}58 + 186{,}42 = 234$ ✔ (llei del paral·lelogram).'
