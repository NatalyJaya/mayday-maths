titulo: Per on començo?
tema: resolucion-triangulos
orden: 8
procedencia: original
dificultad: intermedio
habilidades: [metodo, conceptual]
resumen: Reconèixer el cas a partir de les dades.
enunciado: |
  D’un triangle se’n coneixen $a = 7$, $b = 9$ i $C = 40^\circ$.
apartados:
  - id: a
    enunciado: Quin és el primer pas per resoldre’l?
    respuesta:
      tipo: opciones
      opciones:
        - { texto: 'Teorema del sinus per calcular A.', explicacion: 'Per fer servir el teorema del sinus cal una parella costat–angle oposat completa. L’angle $C$ és oposat a $c$, que no coneixem.' }
        - { texto: 'Teorema del cosinus per calcular c.', correcta: true, explicacion: '$C$ és **entre** els costats $a$ i $b$ (cas CAC): $c^2 = a^2 + b^2 - 2ab\cos C$. Amb $c$ ja hi haurà una parella ($c$, $C$) i es pot continuar.' }
        - { texto: 'Pitàgores per calcular c.', explicacion: 'Només val si $C = 90^\circ$.' }
        - { texto: 'No es pot resoldre: falten dades.', explicacion: 'Tres dades amb almenys un costat n’hi ha prou. Aquí són dos costats i l’angle que formen: el triangle és únic.' }
    pistas:
      - 'Hi ha algun costat del qual coneguis l’angle oposat?'
    pasos:
      - titulo: Identificar el cas
        desarrollo: '$C$ és l’angle format per $a$ i $b$: cas **CAC**. Primer, el teorema del cosinus per a $c$; després, el sinus o el cosinus per a un altre angle.'
    resultado: 'Teorema del cosinus per al costat $c$.'
