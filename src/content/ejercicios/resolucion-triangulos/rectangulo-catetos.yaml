titulo: Resoldre un triangle rectangle (dos catets)
tema: resolucion-triangulos
orden: 2
procedencia: original
dificultad: basico
habilidades: [calculo]
resumen: Pitàgores per a la hipotenusa i arctangent per als angles.
enunciado: Resol el triangle rectangle els catets del qual fan $7\un{m}$ i $24\un{m}$.
figura:
  tipo: triangulo
  a: 7
  b: 24
  c: 25
  base: b
  etiquetas: { a: '7 m', b: '24 m', c: '?', A: '?', B: '?' }
apartados:
  - id: a
    enunciado: Calcula la hipotenusa i els dos angles aguts ($A$, oposat al catet de 7 m, i $B$).
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 'c', etiqueta: hipotenusa, unidad: m, valor: 25 }
        - { simbolo: 'A', etiqueta: angle oposat al catet de 7 m, unidad: '°', valor: 16.26 }
        - { simbolo: 'B', etiqueta: l’altre angle agut, unidad: '°', valor: 73.74 }
    pistas:
      - '$\tan A = \frac{7}{24}$.'
    pasos:
      - titulo: Hipotenusa
        desarrollo: '$$c = \sqrt{7^2 + 24^2} = \sqrt{625} = 25\un{m}$$'
      - titulo: Angles
        desarrollo: '$$A = \arctan\frac{7}{24} \approx 16{,}26^\circ \qquad B = 90^\circ - A \approx 73{,}74^\circ$$'
    resultado: '$c = 25\un{m}$, $A \approx 16{,}26^\circ$, $B \approx 73{,}74^\circ$.'
