# Procedència de tot el material de la plataforma.
#   clase      → apunts i exercicis treballats a classe (etiqueta «Exercici de classe»).
#   externo    → recurs amb llicència oberta del qual s’ADAPTA contingut (amb atribució).
#   referencia → recurs consultat només per identificar tipus de problema i nivell.
#   curriculo  → normativa utilitzada per organitzar el temari.

- id: apuntes-trigonometria-2
  tipo: clase
  titulo: 'Trigonometria 2: apunts i exercicis de la llibreta de classe (passats a net i explicats)'
  autor: Apunts de classe de 1r de Batxillerat, transcrits de les fotos de la llibreta
  licencia: Material privat de classe, utilitzat amb permís
  uso: Exercicis marcats «Exercici de classe» (identitats, Sèrie A, Sèrie B i Problema 31) i les deduccions de les fórmules de la suma, la resta, l’angle doble i l’angle meitat. Els enunciats es conserven tal com es van llegir a la llibreta, amb els avisos de lectura dubtosa. Totes les solucions s’han tornat a comprovar, i els errors detectats als apunts alimenten la secció «Errors freqüents».

