# Blocs de Matemàtiques I (1r de Batxillerat). L’ordre és orientatiu:
# cada centre tria el seu. Només té pàgina un bloc amb algun tema disponible.

- id: numeros
  titulo: Nombres
  lema: Amb què comptem
  descripcion: Els nombres reals, les seves aproximacions i errors, les potències, els radicals i els logaritmes, i una primera mirada als nombres complexos.
  nivel: nucleo
  orden: 1
  icono: numeros
  curriculo: Sentit numèric (Decret 171/2022 i RD 243/2022).

- id: algebra
  titulo: Àlgebra
  lema: El desconegut, amb lletres
  descripcion: Polinomis i fraccions algebraiques, equacions i inequacions de tota mena i sistemes d’equacions resolts pel mètode de Gauss.
  nivel: nucleo
  orden: 2
  icono: algebra
  curriculo: Sentit algebraic (Decret 171/2022 i RD 243/2022).

- id: trigonometria
  titulo: Trigonometria
  lema: Mesurar el que no es pot mesurar
  descripcion: Els angles i les seves raons, la resolució de qualsevol triangle i les identitats i equacions trigonomètriques. Amb la trigonometria es calculen altures, distàncies i angles sense haver de recórrer-los.
  nivel: nucleo
  orden: 3
  icono: trigonometria
  curriculo: Sentit de la mesura i sentit espacial (Decret 171/2022 i RD 243/2022).

- id: geometria
  titulo: Geometria analítica
  lema: El pla amb coordenades
  descripcion: Vectors en el pla, equacions de la recta, posicions relatives, distàncies i angles, llocs geomètrics i còniques.
  nivel: nucleo
  orden: 4
  icono: geometria
  curriculo: Sentit espacial (Decret 171/2022 i RD 243/2022).

- id: analisis
  titulo: Anàlisi
  lema: Com canvien les coses
  descripcion: Funcions elementals, límits i continuïtat, la derivada i la seva interpretació, i la representació gràfica de funcions.
  nivel: nucleo
  orden: 5
  icono: analisis
  curriculo: Sentit algebraic i sentit de la mesura (Decret 171/2022 i RD 243/2022).

- id: estadistica
  titulo: Estadística i probabilitat
  lema: El que diuen les dades
  descripcion: Estadística bidimensional (correlació i regressió), càlcul de probabilitats i distribucions binomial i normal.
  nivel: nucleo
  orden: 6
  icono: estadistica
  curriculo: Sentit estocàstic (Decret 171/2022 i RD 243/2022).
