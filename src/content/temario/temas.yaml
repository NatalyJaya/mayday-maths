# ─── Trigonometria ───
- id: razones-trigonometricas
  bloque: trigonometria
  titulo: Angles i raons trigonomètriques
  estado: disponible
  orden: 1
  resumen: Graus i radiants, sinus, cosinus i tangent, la circumferència goniomètrica i la reducció al primer quadrant.
  esencia: En triangles semblants, el quocient entre dos costats no depèn de la mida, només de l’angle. Aquest nombre (el sinus, el cosinus o la tangent) permet passar d’angles a longituds i al revés.
  aprenderas:
    - Mesurar angles en graus i en radiants i passar d’una unitat a l’altra
    - Calcular les raons d’un angle en un triangle rectangle
    - Deduir els valors exactes de 30°, 45° i 60°
    - Estendre les raons a qualsevol angle amb la circumferència goniomètrica
    - Reduir qualsevol angle al primer quadrant
    - Reconèixer les gràfiques del sinus, el cosinus i la tangent
  antes: |
    Només necessites el **teorema de Pitàgores** i la idea de **triangles semblants** (mateixos angles, costats proporcionals). Tingues a mà una calculadora científica i comprova que la saps posar en mode **graus (DEG)**.
  portada:
    tipo: circunferencia
    angulos:
      - { grados: 150, etiqueta: '150°' }
    cuadrantes: true
  mapa:
    - { q: 'Conec un angle i la hipotenusa', c: '\cy{\text{oposat}} = \text{hip} \cdot \sin\alpha', d: 'fes servir sinus o cosinus segons el catet que busquis' }
    - { q: 'Conec dos costats, busco l’angle', c: '\alpha = \arctan\frac{\cy{\text{oposat}}}{\cx{\text{contigu}}}', d: 'la tecla és sin⁻¹, cos⁻¹ o tan⁻¹, no 1/sin' }
    - { q: 'Sé una raó, busco les altres', c: '\sin^2\alpha + \cos^2\alpha = 1', d: 'el signe el dona el quadrant' }
    - { q: 'Raó d’un angle més gran que 90°', c: '\sin(180^\circ - \alpha) = \sin\alpha', d: 'busca l’angle de referència i posa-hi el signe del quadrant' }
    - { q: 'Passar de graus a radiants', c: '180^\circ = \pi \text{ rad}', d: 'regla de tres; la calculadora, en el mode correcte' }

- id: resolucion-triangulos
  bloque: trigonometria
  titulo: Resolució de triangles
  estado: disponible
  orden: 2
  resumen: Triangles rectangles, doble observació, teorema del sinus (i el seu cas ambigu), teorema del cosinus i àrea d’un triangle.
  esencia: Amb tres dades d’un triangle (i almenys un costat) es poden calcular les altres tres. El teorema del sinus i el del cosinus fan per a qualsevol triangle el que les raons fan per als rectangles.
  aprenderas:
    - Resoldre triangles rectangles i problemes d’altures i distàncies
    - Plantejar problemes de doble observació amb dos triangles rectangles
    - Deduir i aplicar el teorema del sinus, inclòs el cas ambigu
    - Deduir i aplicar el teorema del cosinus
    - Calcular l’àrea de qualsevol triangle
    - Triar el teorema adequat segons les dades
  requisitos: [razones-trigonometricas]
  antes: |
    Necessites dominar el **sinus, el cosinus i la tangent** en un triangle rectangle i saber obtenir un angle amb la calculadora (tecla **sin⁻¹**, **cos⁻¹** o **tan⁻¹**).
  portada:
    tipo: triangulo
    a: 7
    b: 5
    c: 8
    etiquetas: { a: 'a = 7', b: 'b = 5', c: 'c = 8', A: '60°', B: 'B = ?', C: 'C = ?' }
  mapa:
    - { q: 'Triangle rectangle', c: '\sin,\ \cos,\ \tan', d: 'no cal cap teorema' }
    - { q: 'Dos angles i un costat', c: '\frac{a}{\sin A} = \frac{b}{\sin B}', d: 'el tercer angle surt de A + B + C = 180°' }
    - { q: 'Dos costats i l’angle que NO formen', c: '\frac{a}{\sin A} = \frac{b}{\sin B}', d: 'cas ambigu: hi pot haver 0, 1 o 2 triangles' }
    - { q: 'Dos costats i l’angle que formen', c: 'a^2 = b^2 + c^2 - 2bc\cos A', d: 'teorema del cosinus per al tercer costat' }
    - { q: 'Els tres costats', c: '\cos A = \frac{b^2 + c^2 - a^2}{2bc}', d: 'el cosinus no té cas ambigu' }
    - { q: 'Àrea', c: 'S = \tfrac{1}{2}\, b\, c \sin A', d: 'l’angle ha de ser el que formen els dos costats' }

- id: identidades-ecuaciones
  bloque: trigonometria
  titulo: Identitats i equacions trigonomètriques
  estado: disponible
  orden: 3
  resumen: Raons de la suma i la resta d’angles, de l’angle doble i de l’angle meitat, demostració d’identitats i resolució d’equacions trigonomètriques.
  esencia: El sinus no es reparteix. sin(α + β) no és sin α + sin β, i les fórmules d’aquest tema diuen què és en realitat. Amb elles se simplifiquen expressions, es demostren identitats i es resolen equacions, que tenen infinites solucions perquè les raons es repeteixen a cada volta.
  aprenderas:
    - Deduir i fer servir les fórmules de la suma, la resta, l’angle doble i l’angle meitat
    - Calcular raons exactes d’angles com 15°, 75° o 22,5°
    - Distingir una identitat d’una equació
    - Simplificar expressions i demostrar identitats
    - Resoldre equacions trigonomètriques i trobar-ne TOTES les solucions
    - Detectar les solucions falses en elevar al quadrat o en dividir
  requisitos: [razones-trigonometricas]
  antes: |
    Necessites la **identitat fonamental**, els **valors exactes** de 30°, 45° i 60° i saber en quins quadrants és positiva cada raó. També resoldre **equacions de segon grau** i **factoritzar** traient factor comú.
  portada:
    tipo: funcion
    dominio: [-360, 720]
    paso: 180
    curvas:
      - { f: sin, etiqueta: 'y = sin x', color: y }
    niveles:
      - { y: 0.5, etiqueta: 'y = 1/2' }
    puntos:
      - { x: -330 }
      - { x: -210 }
      - { x: 30, etiqueta: '30°' }
      - { x: 150, etiqueta: '150°' }
      - { x: 390 }
      - { x: 510 }
  mapa:
    - { q: 'Raó de 15°, 75°, 105°…', c: '\sin(\alpha \pm \beta)', d: 'escriu-lo com a suma o resta de 30°, 45° i 60°' }
    - { q: 'A l’equació hi ha x i 2x', c: '\cos 2x = 1 - 2\sin^2 x', d: 'tria la forma que deixa una sola raó' }
    - { q: 'Hi apareix x/2', c: '\cos^2\tfrac{x}{2} = \tfrac{1 + \cos x}{2}', d: 'amb el quadrat no cal l’arrel' }
    - { q: 'Equació de 2n grau en sin o cos', c: 't = \sin x', d: 'descarta |t| > 1' }
    - { q: 'Tot multiplicat per sin x o cos x', c: 'A \cdot B = 0', d: 'treu factor comú: NO divideixis' }
    - { q: 'sin x + cos x = k', c: '(\sin x + \cos x)^2', d: 'en elevar al quadrat, comprova les solucions' }

